name: One-shot finish greenfield baseline cleanup

on:
  push:
    branches:
      - fix/installer-resilience-6-bugs

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'justik13/projectx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove remaining legacy referral columns and entitlement types
        shell: python
        run: |
          from pathlib import Path

          path = Path("alembic/versions/0001_clean_baseline.py")
          text = path.read_text()

          replacements = {
              "    referral_days integer NOT NULL,\\n": "",
              "    referral_processed_at timestamp with time zone,\\n": "",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          text = text.replace(
              "ARRAY['account_purchase_grant'::character varying, 'referral_user_bonus'::character varying, 'referral_referrer_bonus'::character varying, 'manual_grant'::character varying]",
              "ARRAY['account_purchase_grant'::character varying, 'manual_grant'::character varying]",
          )
          text = text.replace(
              " OR (((entry_type)::text = 'referral_reversal'::text) AND (days_delta < 0) AND (reversed_entry_id IS NOT NULL) AND ((hours_delta IS NULL) OR (hours_delta = (days_delta * 24))))",
              "",
          )
          text = text.replace(
              "ARRAY['account_purchase_grant'::character varying, 'referral_user_bonus'::character varying, 'referral_referrer_bonus'::character varying, 'referral_reversal'::character varying, 'manual_grant'::character varying, 'tariff_change'::character varying]",
              "ARRAY['account_purchase_grant'::character varying, 'manual_grant'::character varying, 'tariff_change'::character varying]",
          )

          assert "referral_days integer NOT NULL" not in text
          assert "referral_processed_at timestamp with time zone" not in text
          assert "referral_user_bonus" not in text
          assert "referral_referrer_bonus" not in text
          assert "referral_reversal" not in text
          assert "referral_rewards" not in text
          assert "referral_eligibilities" not in text

          path.write_text(text)

      - name: Remove one-shot workflow and commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-shot-fix-greenfield-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alembic/versions/0001_clean_baseline.py .github/workflows/one-shot-fix-greenfield-baseline.yml
          git diff --cached --check
          git commit -m "fix: remove remaining legacy referral schema from baseline"
          git push
