name: PR52 apply access hold fix retry

on:
  push:
    branches:
      - feature/yookassa-account-balance

permissions:
  contents: write

concurrency:
  group: pr52-apply-access-hold-retry
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectx
          POSTGRES_PASSWORD: projectx
          POSTGRES_DB: projectx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectx -d projectx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://projectx:projectx@localhost:5432/projectx_test
      TEST_DATABASE_URL: postgresql+asyncpg://projectx:projectx@localhost:5432/projectx_test
      DB_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      BOT_TOKEN: "123456:TEST_ONLY_NOT_A_REAL_TOKEN"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/yookassa-account-balance
          fetch-depth: 0
      - name: Apply reviewed patch
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = Path('.github/pr52-access.patch.gz.b64').read_text().strip()
          Path('/tmp/pr52.patch').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          git apply --index /tmp/pr52.patch
          git rm .github/pr52-access.patch.gz.b64
          git rm .github/workflows/pr52-apply-access-hold-retry.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.16.1
      - name: Lint focused changes
        run: >-
          ruff check alembic/env.py
          alembic/versions/8d2f4a6c1b70_access_financial_hold.py
          database/models.py services/payment_disputes.py services/subscription.py
          tests/test_api_operations_schema.py tests/test_balance_telegram_ux.py
          tests/test_payment_disputes_postgres.py
          --select E4,E7,E9,F,B,ASYNC,PLE,PLW,RUF100
          --ignore PLW0603,PLW0108
          --output-format full
      - name: Upgrade and compare schema
        run: |
          alembic upgrade head
          alembic check
      - name: Run focused PostgreSQL tests
        run: >-
          python -m unittest -v
          tests.test_payment_disputes_postgres
          tests.test_api_operations_schema
          tests.test_balance_telegram_ux
      - name: Validate tree
        run: |
          python -m compileall -q bot config database services utils alembic tests
          git diff --check
      - name: Commit and rebase validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: separate dispute spending and access holds"
          git fetch origin feature/yookassa-account-balance
          git rebase origin/feature/yookassa-account-balance
          git push origin HEAD:feature/yookassa-account-balance
