name: PR52 apply reviewed financial fix

on:
  push:
    branches:
      - feature/yookassa-account-balance

permissions:
  contents: write

concurrency:
  group: pr52-apply-reviewed-financial-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/yookassa-account-balance
          fetch-depth: 0
      - name: Apply reviewed changes
        env:
          PATCH_B64: 
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          Path('/tmp/pr52.patch').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['PATCH_B64']))
          )
          PY
          git apply --index /tmp/pr52.patch
          git rm .github/pr52-access.patch.gz.b64
          git rm .github/workflows/pr52-apply-access-hold-retry.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: separate dispute spending and access holds"
          git fetch origin feature/yookassa-account-balance
          git rebase origin/feature/yookassa-account-balance
          git push origin HEAD:feature/yookassa-account-balance
