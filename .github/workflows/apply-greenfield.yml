name: cleanup-greenfield-transport

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/greenfield-ui-ux-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenfield-ui-ux-cleanup
          fetch-depth: 0
      - name: Remove patch transport files
        run: rm -rf .github/greenfield-patch
      - name: Commit and push cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/greenfield-patch
          git commit -m 'chore: remove temporary patch transport'
          git push origin HEAD:agent/greenfield-ui-ux-cleanup
