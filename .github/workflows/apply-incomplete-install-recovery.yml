name: apply incomplete-install recovery hotfix

on:
  push:
    branches:
      - agent/fix-incomplete-install-recovery
    paths:
      - .github/incomplete-install-recovery-trigger

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-incomplete-install-recovery
          fetch-depth: 0

      - name: Apply recovery patch
        run: |
          git apply --recount --check .github/incomplete-install-recovery.patch
          git apply --recount .github/incomplete-install-recovery.patch
          rm -f .github/incomplete-install-recovery.patch
          rm -f .github/incomplete-install-recovery-trigger
          rm -f .github/workflows/apply-incomplete-install-recovery.yml

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell and targeted tests
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/uninstall.sh
          shellcheck --severity=error scripts/deploy.sh scripts/uninstall.sh
          python -m unittest discover -s tests -p 'test_install_recovery_hotfix.py' -v
          python -m unittest discover -s tests -p 'test_service_home_hotfix.py' -v
          python -m unittest discover -s tests -p 'test_shell_hotfix.py' -v
          python -m unittest discover -s tests -p 'test_shell_layout.py' -v
          git diff --check

      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/deploy.sh scripts/uninstall.sh tests/test_install_recovery_hotfix.py
          git add -u .github
          git commit -m 'fix: recover incomplete installs safely'
          git push origin HEAD:agent/fix-incomplete-install-recovery
