name: Fix installer README example

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenfield-ui-ux-cleanup
          fetch-depth: 0
      - name: Replace unsafe copy-paste example
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = """  DOMAIN='vpn.example.com' \\
  SSL_EMAIL='admin@example.com' \\
  YOOKASSA_SHOP_ID='...' \\
  YOOKASSA_SECRET_KEY='...' \\
"""
          new = """  DOMAIN='' \\
  SSL_EMAIL='' \\
  YOOKASSA_SHOP_ID='' \\
  YOOKASSA_SECRET_KEY='' \\
"""
          if old not in text:
              raise SystemExit('README install example not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: make installer example safe to copy'
          git pull --rebase origin agent/greenfield-ui-ux-cleanup
          git push origin HEAD:agent/greenfield-ui-ux-cleanup
