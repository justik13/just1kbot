name: tests

on:
  pull_request:
  push:
    branches: [main, feature/yookassa-account-balance]

permissions:
  contents: write

jobs:
  apply-pr52-fixture-fix:
    if: (github.event_name == 'push' && github.ref_name == 'feature/yookassa-account-balance') || (github.event_name == 'pull_request' && github.head_ref == 'feature/yookassa-account-balance')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/yookassa-account-balance
          fetch-depth: 0
      - name: Refresh verified duplicate-refund fixture and clean CI
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_payment_pipeline_postgres.py')
          source = path.read_text(encoding='utf-8')
          helper_start = source.index('    async def _finalize_duplicate_refund')
          helper_end = source.index('\n    async def test_duplicate_full_refund', helper_start)
          helper = source[helper_start:helper_end]

          old_payload = '''        payload = {
            "object": {
                "id": refund_id,
                "payment_id": p.external_id,
                "amount": {"value": "90.00", "currency": "RUB"},
            }
        }
'''
          new_payload = '''        verified_refund = {
            "id": refund_id,
            "status": "succeeded",
            "payment_id": p.external_id,
            "amount": {"value": "90.00", "currency": "RUB"},
        }
        payload = {"object": dict(verified_refund)}
'''
          old_result = '''            None,
        )
        return row
'''
          new_result = '''            YooKassaResult(True, value=verified_refund),
        )
        return row
'''
          if helper.count(old_payload) != 1 or helper.count(old_result) != 1:
              raise SystemExit('duplicate-refund fixture contract changed unexpectedly')
          helper = helper.replace(old_payload, new_payload, 1)
          helper = helper.replace(old_result, new_result, 1)
          source = source[:helper_start] + helper + source[helper_end:]
          path.write_text(source, encoding='utf-8')
          PY
          git checkout 5701c18be265930152f3599bf2aabc66d05ff30f -- .github/workflows/tests.yml
          rm -f .github/workflows/pr52-refresh-refund-fixtures.yml
          rm -f .github/pr52-run-helper .github/pr52-official-fix.patch.gz.b64
          rm -rf .github/pr52-official-fix-chunks
          git add -A
          git diff --cached --check
          python -m compileall -q tests/test_payment_pipeline_postgres.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: verify duplicate refund fixtures and clean CI"
          git push origin HEAD:feature/yookassa-account-balance

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectx
          POSTGRES_PASSWORD: projectx
          POSTGRES_DB: projectx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectx -d projectx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://projectx:projectx@localhost:5432/projectx_test
      TEST_DATABASE_URL: postgresql+asyncpg://projectx:projectx@localhost:5432/projectx_test
      DB_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      BOT_TOKEN: "123456:TEST_ONLY_NOT_A_REAL_TOKEN"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install Python static analysis tools
        run: python -m pip install ruff==0.16.1
      - name: Audit Python syntax, imports and common human errors
        run: >-
          ruff check
          bot config database services utils alembic tests
          --select E4,E7,E9,F,B,ASYNC,PLE,PLW,RUF100
          --ignore PLW0603,PLW0108
          --output-format full
      - name: Install backup and shell tools
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client shellcheck
      - name: ShellCheck repository scripts
        run: find . -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
      - run: alembic upgrade head
      - name: Run full test suite
        id: unittests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/unittest.log
        env:
          RUN_BACKUP_INTEGRATION: "1"
          BACKUP_TEST_DATABASE_URL: postgresql://projectx:projectx@localhost:5432/projectx_test
      - name: Upload failing unittest log
        if: failure() && steps.unittests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unittest-log-${{ github.sha }}
          path: /tmp/unittest.log
          if-no-files-found: error
          retention-days: 7
      - run: alembic downgrade base
      - name: Verify downgrade leaves no application tables
        run: |
          PGPASSWORD=projectx psql -h localhost -U projectx -d projectx_test \
            -v ON_ERROR_STOP=1 -c 'DROP TABLE IF EXISTS backup_rehearsal_data'
          remaining="$(PGPASSWORD=projectx psql -h localhost -U projectx -d projectx_test -Atc \
            "SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename <> 'alembic_version' ORDER BY tablename")"
          if [ -n "$remaining" ]; then
            printf 'Application tables remain after downgrade:\n%s\n' "$remaining" >&2
            exit 1
          fi
      - run: alembic upgrade head
      - name: Compile all tracked Python trees
        run: python -m compileall -q bot config database services utils alembic tests
      - run: git diff --check
