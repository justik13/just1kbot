name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Generate deterministic hash lock
        run: |
          python -m pip install 'pip==25.3' 'pip-tools==7.5.2'
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --allow-unsafe \
            --strip-extras \
            --output-file /tmp/requirements.lock \
            requirements.txt
      - name: Verify committed lock is current
        run: |
          if [ -f requirements.lock ]; then
            grep -v '^#' requirements.lock > /tmp/req_repo.txt
            grep -v '^#' /tmp/requirements.lock > /tmp/req_ci.txt
            diff -u /tmp/req_repo.txt /tmp/req_ci.txt > /tmp/diff.txt || true
          else
            echo 'requirements.lock is not committed yet; artifact will be used by the test job.'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: diff-tests
          path: /tmp/diff.txt
      - name: Fail if diff exists
        run: |
          if [ -s /tmp/diff.txt ]; then
            echo "Lockfile is out of date. Check the diff-tests artifact."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: requirements-lock-${{ github.sha }}
          path: /tmp/requirements.lock
          if-no-files-found: error
          retention-days: 7

  test:
    needs: lock
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectx
          POSTGRES_PASSWORD: projectx
          POSTGRES_DB: projectx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectx -d projectx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        command: redis-server --requirepass ci_redis_password
        options: >-
          --health-cmd "redis-cli -a ci_redis_password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://projectx:projectx@localhost:5432/projectx_test
      TEST_DATABASE_URL: postgresql+asyncpg://projectx:projectx@localhost:5432/projectx_test
      DB_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      BOT_TOKEN: "123456:TEST_ONLY_NOT_A_REAL_TOKEN"
      SUPPORT_USERNAME: "test_support_bot"
      ADMIN_IDS: "[123456789]"
      REDIS_URL: "redis://:ci_redis_password@localhost:6379/0"
      REDIS_PASSWORD: "ci_redis_password"
      YOOKASSA_SHOP_ID: "123456"
      YOOKASSA_SECRET_KEY: "ci_test_secret"
      YOOKASSA_RETURN_URL: "https://t.me/{bot_username}"
      YOOKASSA_WEBHOOK_PORT: "8080"
      DOMAIN: "vpn.example.test"
      SSL_EMAIL: "ci@example.test"
      CI_TEST_MODE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: requirements-lock-${{ github.sha }}
          path: /tmp/generated-lock
      - name: Install exact locked Python dependencies
        run: |
          python -m pip install 'pip==25.3'
          python -m pip install --require-hashes -r /tmp/generated-lock/requirements.lock
      - name: Install Python static analysis tools
        run: python -m pip install ruff==0.16.1
      - name: Audit Python syntax, imports and common human errors
        run: >-
          ruff check
          bot config database services utils alembic scripts tests integrations
          --select E4,E7,E9,F,B,ASYNC,PLE,PLW,RUF100
          --ignore PLW0603,PLW0108,ASYNC109
          --output-format full
      - name: Verify fixed platform
        run: |
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(python -c 'import sys; print("%s.%s" % sys.version_info[:2])')" = 3.12
      - name: ShellCheck repository scripts
        run: find . -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
      - run: alembic upgrade head
      - name: Run full test suite
        id: unittests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/unittest.log || {
            echo "=================== FAILED TEST LOG ==================="
            cat /tmp/unittest.log | grep -E '^(FAIL|ERROR|AssertionError|Traceback|  File)' -A 5 -B 2 || cat /tmp/unittest.log
            exit 1
          }
        env:
          RUN_BACKUP_INTEGRATION: "1"
          BACKUP_TEST_DATABASE_URL: postgresql://projectx:projectx@localhost:5432/projectx_test

      - name: Install pinned Xray core binary for integration testing
        run: |
          mkdir -p /tmp/xray-bin
          curl -sSL -o /tmp/xray-bin/Xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip
          echo "8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40 /tmp/xray-bin/Xray.zip" | sha256sum -c -
          unzip -q /tmp/xray-bin/Xray.zip -d /tmp/xray-bin
          sudo cp /tmp/xray-bin/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          /usr/local/bin/xray version

      - name: Run xray-api microservice tests
        run: |
          python -m pip install -r scripts/xray_api/requirements.txt
          pytest scripts/xray_api/tests -v

      - name: Audit locked dependencies for known CVEs
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit --no-deps -r requirements.lock

      - name: Audit dev dependencies for known CVEs
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit --no-deps -r requirements-dev.txt

      - name: Upload failing unittest log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unittest-log-${{ github.sha }}
          path: /tmp/unittest.log
          if-no-files-found: warn
          retention-days: 7

      - run: alembic downgrade base
      - name: Verify downgrade leaves no application tables
        run: |
          PGPASSWORD=projectx psql -h localhost -U projectx -d projectx_test \
            -v ON_ERROR_STOP=1 -c 'DROP TABLE IF EXISTS backup_rehearsal_data'
          remaining="$(PGPASSWORD=projectx psql -h localhost -U projectx -d projectx_test -Atc \
            "SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename <> 'alembic_version' ORDER BY tablename")"
          if [ -n "$remaining" ]; then
            printf 'Application tables remain after downgrade:\n%s\n' "$remaining" >&2
            exit 1
          fi
      - run: alembic upgrade head
      - name: Compile all tracked Python trees
        run: python -m compileall -q bot config database services utils alembic scripts tests integrations
      - run: git diff --check


