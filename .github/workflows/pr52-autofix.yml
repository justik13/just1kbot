name: PR 52 workspace audit

on:
  push:
    branches:
      - feature/yookassa-account-balance

permissions:
  contents: read

jobs:
  export-workspace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/yookassa-account-balance
          fetch-depth: 0
      - name: Export exact source tree
        run: git archive --format=zip --output=pr52-source-${GITHUB_SHA}.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: pr52-source-${{ github.sha }}
          path: pr52-source-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 1
