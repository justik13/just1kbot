name: Run required YooKassa contract

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 53
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenfield-ui-ux-cleanup
          fetch-depth: 0

      - name: Apply corrected transformation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-required-yookassa-contract.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run targeted checks"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          body = source[start:end]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          ) + "\n"

          segment_start = body.index("old_method = '''")
          segment_end = body.index("env_anchor =", segment_start)
          replacement = r'''new_method = textwrap.indent(
              textwrap.dedent("""\
          def test_valid_install_input_requires_payment_contract_but_not_amnezia(self):
              result = self.run_function(
                  "BOT_TOKEN='123456:TEST_TOKEN'; "
                  "DB_PASSWORD='password1'; REDIS_PASSWORD='password2'; "
                  "ADMIN_IDS='123'; SUPPORT_USERNAME='test_support_bot'; "
                  "YOOKASSA_SHOP_ID='123456'; YOOKASSA_SECRET_KEY='secret'; "
                  "YOOKASSA_RETURN_URL='https://t.me/{bot_username}'; "
                  "YOOKASSA_WEBHOOK_PORT='8080'; "
                  "DOMAIN='vpn.example.test'; SSL_EMAIL='owner@example.test'; "
                  "validate_initial_input"
              )
              self.assertEqual(result.returncode, 0, result.stdout + result.stderr)

              source = CORE.read_text(encoding="utf-8")
              self.assertNotIn("Enter — отключено", source)
              self.assertNotIn("YooKassa отключена", source)

              for missing_assignment, expected in (
                  ("YOOKASSA_SHOP_ID='';", "YOOKASSA"),
                  ("YOOKASSA_SECRET_KEY='';", "YOOKASSA"),
                  ("DOMAIN='';", "DOMAIN"),
                  ("SSL_EMAIL='';", "SSL_EMAIL"),
              ):
                  with self.subTest(missing_assignment=missing_assignment):
                      command = (
                          "BOT_TOKEN='123456:TEST_TOKEN'; "
                          "DB_PASSWORD='password1'; REDIS_PASSWORD='password2'; "
                          "ADMIN_IDS='123'; SUPPORT_USERNAME='test_support_bot'; "
                          "YOOKASSA_SHOP_ID='123456'; YOOKASSA_SECRET_KEY='secret'; "
                          "YOOKASSA_RETURN_URL='https://t.me/{bot_username}'; "
                          "YOOKASSA_WEBHOOK_PORT='8080'; "
                          "DOMAIN='vpn.example.test'; SSL_EMAIL='owner@example.test'; "
                          + missing_assignment
                          + " validate_initial_input"
                      )
                      missing_result = self.run_function(command)
                      self.assertNotEqual(missing_result.returncode, 0)
                      self.assertIn(expected, missing_result.stderr)

          """),
              "    ",
          )
          text = replace_between(
              text,
              "    def test_valid_install_input_does_not_need_amnezia_values(self):\n",
              "    def test_domain_rejects_placeholder_certbot_email(self):\n",
              new_method,
              "installer valid and missing tests",
          )

          '''
          body = body[:segment_start] + replacement + body[segment_end:]
          Path('/tmp/apply_required_yookassa.py').write_text(body, encoding='utf-8')
          PY
          python /tmp/apply_required_yookassa.py
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_installer_input_contract.py')
          test_text = test_path.read_text(encoding='utf-8')
          old = (
              '                \'DB_ENCRYPTION_KEY="MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="\\n\',\n'
              '                \'REDIS_PASSWORD="password2"\\n\''
          )
          new = (
              '                \'DB_ENCRYPTION_KEY="MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="\\n\'\n'
              '                \'REDIS_PASSWORD="password2"\\n\''
          )
          if old not in test_text:
              raise SystemExit('generated existing-env fixture separator not found')
          test_path.write_text(test_text.replace(old, new, 1), encoding='utf-8')

          settings_path = Path('config/settings.py')
          settings_text = settings_path.read_text(encoding='utf-8')
          validators_start = settings_text.index('    @field_validator("BOT_TOKEN")\n')
          validators_end = settings_text.index(
              '    @field_validator("SUPPORT_USERNAME")\n', validators_start
          )
          validator_block = '''    @field_validator("BOT_TOKEN")
              @classmethod
              def validate_bot_token(cls, value: str) -> str:
                  token = value.strip()
                  if re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token) is None:
                      raise ValueError("BOT_TOKEN has invalid format")
                  return token

              @field_validator("ADMIN_IDS")
              @classmethod
              def validate_admin_ids(cls, value: List[int]) -> List[int]:
                  if not value or any(item <= 0 for item in value):
                      raise ValueError("ADMIN_IDS must contain positive Telegram IDs")
                  return value

              @field_validator(
                  "DATABASE_URL",
                  "DB_ENCRYPTION_KEY",
                  "REDIS_URL",
                  "REDIS_PASSWORD",
                  "YOOKASSA_SHOP_ID",
                  "YOOKASSA_SECRET_KEY",
                  "YOOKASSA_RETURN_URL",
              )
              @classmethod
              def validate_required_value(cls, value: str) -> str:
                  normalized = value.strip()
                  if not normalized or "change_me" in normalized.lower():
                      raise ValueError(
                          "required production setting is empty or placeholder"
                      )
                  return normalized

              @field_validator("DOMAIN")
              @classmethod
              def validate_domain(cls, value: str) -> str:
                  domain = value.strip().lower().rstrip(".")
                  labels = domain.split(".")
                  label_pattern = re.compile(
                      r"^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
                  )
                  if (
                      not domain
                      or len(domain) > 253
                      or len(labels) < 2
                      or any(
                          label_pattern.fullmatch(label) is None
                          for label in labels
                      )
                  ):
                      raise ValueError("DOMAIN must be a valid public hostname")
                  return domain

              @field_validator("SSL_EMAIL")
              @classmethod
              def validate_ssl_email(cls, value: str) -> str:
                  email = value.strip().lower()
                  if (
                      not email
                      or email
                      in {"admin@example.com", "change_me@example.com"}
                      or re.fullmatch(
                          r"[^@\\s]+@[^@\\s]+\\.[^@\\s]+", email
                      )
                      is None
                  ):
                      raise ValueError(
                          "SSL_EMAIL must be a real certificate email"
                      )
                  return email

              @field_validator("YOOKASSA_WEBHOOK_PORT")
              @classmethod
              def validate_webhook_port(cls, value: int) -> int:
                  if value < 1 or value > 65535:
                      raise ValueError(
                          "YOOKASSA_WEBHOOK_PORT must be between 1 and 65535"
                      )
                  return value

          '''
          validator_block = ''.join(
              line[12:] if line.startswith('            ') else line
              for line in validator_block.splitlines(keepends=True)
          )
          settings_path.write_text(
              settings_text[:validators_start]
              + validator_block
              + settings_text[validators_end:],
              encoding='utf-8',
          )
          PY

      - name: Run targeted checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt --quiet
          python -m py_compile config/settings.py tests/test_installer_input_contract.py tests/test_runtime_config_contract.py
          bash -n deploy.sh scripts/deploy.sh scripts/deploy_full.sh scripts/deploy_full_library.sh scripts/lib/deploy_core.inc
          shellcheck --severity=error deploy.sh scripts/deploy.sh scripts/deploy_full.sh scripts/deploy_full_library.sh
          python -m unittest discover -s tests -p 'test_installer_input_contract.py' -v
          python -m unittest discover -s tests -p 'test_runtime_config_contract.py' -v
          python -m unittest discover -s tests -p 'test_deploy_rollback.py' -v
          git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-required-yookassa-contract.yml \
            .github/workflows/run-required-yookassa-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: require complete YooKassa production configuration'
          git pull --rebase origin agent/greenfield-ui-ux-cleanup
          git push origin HEAD:agent/greenfield-ui-ux-cleanup
