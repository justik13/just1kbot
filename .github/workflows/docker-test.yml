name: Docker Compose CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Ephemeral CI Env and Age Key
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age
          age-keygen -o ci-key.txt
          PUBKEY="$(sed -n 's/^# public key: //p' ci-key.txt)"
          test -n "$PUBKEY"
          DB_PASS='Pg_@#%^&*()_pass'
          REDIS_PASS='Redis_!@#%_pass'
          cat > .env <<EOF
          BOT_TOKEN='123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11'
          ADMIN_IDS='[123456,654321]'
          SUPPORT_USERNAME='ci_support_bot'
          DB_ENCRYPTION_KEY='MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA='
          POSTGRES_USER='just1kbot'
          POSTGRES_PASSWORD='$DB_PASS'
          POSTGRES_DB='just1kbot_bot'
          REDIS_PASSWORD='$REDIS_PASS'
          YOOKASSA_SHOP_ID='123456'
          YOOKASSA_SECRET_KEY='ci_test_secret'
          YOOKASSA_RETURN_URL='https://t.me/{bot_username}'
          YOOKASSA_WEBHOOK_PORT='8080'
          DOMAIN='vpn.example.test'
          SSL_EMAIL='ci@example.test'
          BACKUP_AGE_RECIPIENT='$PUBKEY'
          EOF
          echo "DB_PASS=$DB_PASS" >> "$GITHUB_ENV"
          echo "REDIS_PASS=$REDIS_PASS" >> "$GITHUB_ENV"

      - name: Validate Compose Configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config --quiet

      - name: Build and Start Services
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait and Assert Health Status
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for containers to become healthy..."
          timeout_seconds=120
          elapsed=0
          while [ "$elapsed" -lt "$timeout_seconds" ]; do
            migrate_state="$(docker inspect --format='{{.State.Status}}/{{.State.ExitCode}}' just1kbot_migrate 2>/dev/null || echo missing)"
            if [[ "$migrate_state" == "exited/"* ]] && [[ "$migrate_state" != "exited/0" ]]; then
              echo "Migration container failed: $migrate_state"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs migrate
              exit 1
            fi

            DB_HEALTH="$(docker inspect --format='{{.State.Health.Status}}' just1kbot_db 2>/dev/null || echo starting)"
            REDIS_HEALTH="$(docker inspect --format='{{.State.Health.Status}}' just1kbot_redis 2>/dev/null || echo starting)"
            BOT_HEALTH="$(docker inspect --format='{{.State.Health.Status}}' just1kbot_app 2>/dev/null || echo starting)"
            CADDY_STATE="$(docker inspect --format='{{.State.Status}}' just1kbot_caddy 2>/dev/null || echo missing)"
            echo "db=$DB_HEALTH redis=$REDIS_HEALTH bot=$BOT_HEALTH caddy=$CADDY_STATE"

            if [ "$DB_HEALTH" = healthy ] && [ "$REDIS_HEALTH" = healthy ] && [ "$BOT_HEALTH" = healthy ] && [ "$CADDY_STATE" = running ]; then
              echo "All services are healthy and Caddy is running."
              break
            fi

            if [ "$DB_HEALTH" = unhealthy ] || [ "$REDIS_HEALTH" = unhealthy ] || [ "$BOT_HEALTH" = unhealthy ] || [ "$CADDY_STATE" = exited ] || [ "$CADDY_STATE" = dead ]; then
              echo "A service became unhealthy or stopped!"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color
              diag="$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a --format '{{.Service}}={{.State}}' | tr '\n' ';')"
              bot_logs="$(docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=30 bot 2>&1 | tr '\n' ' ' | cut -c1-3000)"
              bot_health_log="$(docker inspect --format='{{.State.Status}}/{{.State.Health.Status}} {{range .State.Health.Log}}{{.Output}}{{end}}' just1kbot_app 2>/dev/null | tr '\n' ' ' || true)"
              migrate_state="$(docker inspect --format='{{.State.Status}}/{{.State.ExitCode}}' just1kbot_migrate 2>/dev/null || echo missing)"
              echo "::error title=Container diagnostics::services=$diag bot_logs=$bot_logs bot_health=$bot_health_log migrate=$migrate_state"
              exit 1
            fi

            sleep 2
            elapsed=$((elapsed + 2))
          done

          if [ "$elapsed" -ge "$timeout_seconds" ]; then
            echo "Timeout waiting for healthy status."
            docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a
            docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color
            diag="$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a --format '{{.Service}}={{.State}}' | tr '\n' ';')"
            bot_logs="$(docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=30 bot 2>&1 | tr '\n' ' ' | cut -c1-3000)"
            bot_health_log="$(docker inspect --format='{{.State.Status}}/{{.State.Health.Status}} {{range .State.Health.Log}}{{.Output}}{{end}}' just1kbot_app 2>/dev/null | tr '\n' ' ' || true)"
            migrate_state="$(docker inspect --format='{{.State.Status}}/{{.State.ExitCode}}' just1kbot_migrate 2>/dev/null || echo missing)"
            echo "::error title=Container diagnostics::services=$diag bot_logs=$bot_logs bot_health=$bot_health_log migrate=$migrate_state"
            exit 1
          fi

      - name: Test Caddy Proxy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://localhost:8081/health

      - name: Seed Backup Probe Data
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T -e PGPASSWORD="$DB_PASS" db psql -U just1kbot -d just1kbot_bot -v ON_ERROR_STOP=1 -c "DROP TABLE IF EXISTS ci_backup_probe; CREATE TABLE ci_backup_probe (id integer PRIMARY KEY, marker text NOT NULL); INSERT INTO ci_backup_probe (id, marker) VALUES (1, 'pr78-backup-restore');"

      - name: Test Backup and Restore
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile tools run --rm backup
          BACKUP_FILE="$(find backups -maxdepth 1 -type f -name '*.sql.gz.age' -print -quit)"
          test -n "$BACKUP_FILE"
          if find backups -maxdepth 1 -type f -name '*.sql.gz' -print -quit | grep -q .; then echo "Plaintext backup was not cleaned up!"; exit 1; fi
          age -d -i ci-key.txt "$BACKUP_FILE" > backup-restored.sql.gz
          test -s backup-restored.sql.gz
          gunzip backup-restored.sql.gz
          test -s backup-restored.sql
          docker compose exec -T -e PGPASSWORD="$DB_PASS" db dropdb -U just1kbot --if-exists just1kbot_restore
          docker compose exec -T -e PGPASSWORD="$DB_PASS" db createdb -U just1kbot just1kbot_restore
          docker cp backup-restored.sql just1kbot_db:/tmp/restore.sql
          docker compose exec -T -e PGPASSWORD="$DB_PASS" db psql -U just1kbot -d just1kbot_restore -v ON_ERROR_STOP=1 -f /tmp/restore.sql
          RESTORE_MARKER="$(docker compose exec -T -e PGPASSWORD="$DB_PASS" db psql -U just1kbot -d just1kbot_restore -Atc "SELECT marker FROM ci_backup_probe WHERE id = 1;")"
          test "$RESTORE_MARKER" = "pr78-backup-restore"
          docker compose exec -T -e PGPASSWORD="$DB_PASS" db dropdb -U just1kbot --if-exists just1kbot_restore

      - name: Test Alembic Idempotency Through Real Bot Restart
        shell: bash
        run: |
          set -euo pipefail
          docker compose restart bot
          timeout_seconds=120
          elapsed=0
          while [ "$elapsed" -lt "$timeout_seconds" ]; do
            BOT_STATE="$(docker inspect --format='{{.State.Status}}' just1kbot_app 2>/dev/null || echo missing)"
            BOT_HEALTH="$(docker inspect --format='{{.State.Health.Status}}' just1kbot_app 2>/dev/null || echo starting)"
            echo "bot_state=$BOT_STATE bot_health=$BOT_HEALTH"
            if [ "$BOT_STATE" = running ] && [ "$BOT_HEALTH" = healthy ]; then break; fi
            if [ "$BOT_STATE" = exited ] || [ "$BOT_STATE" = dead ] || [ "$BOT_HEALTH" = unhealthy ]; then docker compose logs --no-color bot; exit 1; fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          if [ "$elapsed" -ge "$timeout_seconds" ]; then docker compose logs --no-color bot; exit 1; fi

      - name: View logs (if failure)
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v --remove-orphans || true
          rm -f ci-key.txt .env backup-restored.sql backup-restored.sql.gz
