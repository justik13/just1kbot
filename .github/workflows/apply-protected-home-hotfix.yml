name: apply protected-home hotfix

on:
  push:
    branches:
      - agent/fix-protected-home-startup
    paths:
      - .github/protected-home-trigger

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-protected-home-startup
          fetch-depth: 0

      - name: Apply hotfix patch
        run: |
          git apply --recount --check .github/protected-home-hotfix.patch
          git apply --recount .github/protected-home-hotfix.patch
          rm -f .github/protected-home-hotfix.patch
          rm -f .github/protected-home-trigger
          rm -f .github/workflows/apply-protected-home-hotfix.yml

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell changes
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/uninstall.sh
          shellcheck --severity=error scripts/deploy.sh scripts/uninstall.sh
          git diff --check

      - name: Run targeted regression tests
        run: |
          python -m unittest discover -s tests -p 'test_service_home_hotfix.py' -v
          python -m unittest discover -s tests -p 'test_shell_layout.py' -v
          python -m unittest discover -s tests -p 'test_shell_stage3.py' -v

      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/deploy.sh scripts/uninstall.sh
          git add -u .github
          git commit -m 'fix: use runtime home under systemd sandbox'
          git push origin HEAD:agent/fix-protected-home-startup
