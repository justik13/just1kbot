name: Run installer audit fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenfield-ui-ux-cleanup
          fetch-depth: 0

      - name: Apply installer corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fix-installer-audit.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run targeted installer checks"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          body = source[start:end]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          script = "import textwrap\n" + body + "\n"
          Path('/tmp/fix_installer.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/fix_installer.py
          python - <<'PY'
          from pathlib import Path

          core_path = Path('scripts/lib/deploy_core.inc')
          core = core_path.read_text(encoding='utf-8')
          old_prompt = "printf 'Укажите реальный email для Let's Encrypt.\\n'"
          new_prompt = "printf 'Укажите реальный email для сертификата.\\n'"
          if old_prompt not in core:
              raise SystemExit('unsafe email prompt not found')
          core_path.write_text(core.replace(old_prompt, new_prompt, 1), encoding='utf-8')

          test_path = Path('tests/test_deploy_rollback.py')
          test = test_path.read_text(encoding='utf-8')
          old_token = 'BOT_TOKEN=x; DB_PASSWORD=password1; REDIS_PASSWORD=password2; ADMIN_IDS=1; SUPPORT_USERNAME=test_support_bot;'
          new_token = "BOT_TOKEN=123456:TEST_TOKEN; DB_PASSWORD=password1; REDIS_PASSWORD=password2; ADMIN_IDS=1; SUPPORT_USERNAME=test_support_bot;"
          if old_token not in test:
              raise SystemExit('legacy invalid token fixture not found')
          test_path.write_text(test.replace(old_token, new_token, 1), encoding='utf-8')
          PY

      - name: Run targeted checks
        shell: bash
        env:
          SUPPORT_USERNAME: test_support_bot
        run: |
          set -euo pipefail
          for script in \
            deploy.sh \
            scripts/deploy.sh \
            scripts/deploy_full.sh \
            scripts/deploy_full_library.sh \
            scripts/lib/deploy_core.inc \
            scripts/setup-amnezia-api.sh; do
            if ! bash -n "$script"; then
              printf 'Syntax failure in %s\n' "$script" >&2
              nl -ba "$script" | sed -n '750,820p' >&2
              exit 1
            fi
          done
          for pattern in \
            test_installer_input_contract.py \
            test_shell_layout.py \
            test_shell_stage3.py \
            test_deploy_rollback.py; do
            python -m unittest discover -s tests -p "$pattern" -v
          done
          git diff --check

      - name: Commit installer fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy.sh README.md scripts/deploy.sh scripts/lib/deploy_core.inc tests/test_deploy_rollback.py tests/test_installer_input_contract.py
          git commit -m 'fix: align installer with current server configuration'
          git pull --rebase origin agent/greenfield-ui-ux-cleanup
          git push origin HEAD:agent/greenfield-ui-ux-cleanup
