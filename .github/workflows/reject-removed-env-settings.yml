name: Reject removed env settings

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 53
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenfield-ui-ux-cleanup
          fetch-depth: 0

      - name: Reject removed settings before deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/lib/deploy_core.inc")
          text = path.read_text(encoding="utf-8")
          old = '''    local bot_token support_username admin_ids encryption_key
              local shop_id secret_key domain ssl_email webhook_port
          '''
          new = '''    local removed
              for removed in AMNEZIA_API_URL AMNEZIA_API_KEY WEBHOOK_URL; do
                  value=$(read_env_value "$removed")
                  if [[ -n "$value" ]]; then
                      error "В production .env найден удалённый параметр: $removed"
                      return 1
                  fi
              done

              local bot_token support_username admin_ids encryption_key
              local shop_id secret_key domain ssl_email webhook_port
          '''
          if old not in text:
              raise SystemExit("validate_env_file insertion point not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run targeted checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt --quiet
          bash -n deploy.sh scripts/deploy.sh scripts/deploy_full.sh scripts/deploy_full_library.sh scripts/lib/deploy_core.inc
          shellcheck --severity=error deploy.sh scripts/deploy.sh scripts/deploy_full.sh scripts/deploy_full_library.sh
          python -m unittest discover -s tests -p 'test_installer_input_contract.py' -v
          python -m unittest discover -s tests -p 'test_runtime_config_contract.py' -v
          python -m unittest discover -s tests -p 'test_greenfield_contract.py' -v
          git diff --check

      - name: Commit verified change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reject-removed-env-settings.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: reject removed global integration settings'
          git pull --rebase origin agent/greenfield-ui-ux-cleanup
          git push origin HEAD:agent/greenfield-ui-ux-cleanup
