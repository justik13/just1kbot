name: fix-greenfield-lint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/greenfield-ui-ux-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenfield-ui-ux-cleanup
          fetch-depth: 0
      - name: Apply verified cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot/handlers/admin/servers/edit_routes.py')
          source = path.read_text(encoding='utf-8')
          old = 'from sqlalchemy import func, select, update\n'
          if source.count(old) != 1:
              raise SystemExit('unexpected edit_routes import state')
          path.write_text(source.replace(old, 'from sqlalchemy import func, select\n'), encoding='utf-8')

          path = Path('services/tariff_change_quote.py')
          source = path.read_text(encoding='utf-8')
          old = '''    if await get_unfinished_financial_checkout(session, user_id=user_id):\n        return TariffChangeQuoteResult(failure_code="unfinished_checkout_exists")\n\n'''
          if source.count(old) != 1:
              raise SystemExit('unexpected tariff quote state')
          path.write_text(source.replace(old, ''), encoding='utf-8')
          PY
          python -m compileall -q bot services database utils
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/handlers/admin/servers/edit_routes.py services/tariff_change_quote.py
          git commit -m 'fix: finish greenfield checkout cleanup'
          git push origin HEAD:agent/greenfield-ui-ux-cleanup
