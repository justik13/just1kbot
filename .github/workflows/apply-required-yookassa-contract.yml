name: Apply required YooKassa contract

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 53
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/greenfield-ui-ux-cleanup
          fetch-depth: 0

      - name: Apply fail-closed production configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_exact(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing expected snippet: {label}")
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              try:
                  start_index = text.index(start)
                  end_index = text.index(end, start_index)
              except ValueError as exc:
                  raise SystemExit(f"missing function boundary: {label}") from exc
              return text[:start_index] + replacement + text[end_index:]

          # Runtime settings: every production integration value must exist and be non-empty.
          path = Path("config/settings.py")
          text = path.read_text(encoding="utf-8")
          text = replace_exact(text, "    ADMIN_IDS: List[int] = []\n", "    ADMIN_IDS: List[int]\n", "ADMIN_IDS required")
          text = replace_exact(text, '    REDIS_URL: str = "redis://localhost:6379/0"\n    REDIS_PASSWORD: str = ""\n', '    REDIS_URL: str\n    REDIS_PASSWORD: str\n', "Redis required")
          text = replace_exact(
              text,
              '    YOOKASSA_SHOP_ID: str = ""\n    YOOKASSA_SECRET_KEY: str = ""\n    YOOKASSA_RETURN_URL: str = "https://t.me/{bot_username}"\n    YOOKASSA_WEBHOOK_PORT: int = 8080\n',
              '    YOOKASSA_SHOP_ID: str\n    YOOKASSA_SECRET_KEY: str\n    YOOKASSA_RETURN_URL: str\n    YOOKASSA_WEBHOOK_PORT: int\n    DOMAIN: str\n    SSL_EMAIL: str\n',
              "YooKassa settings required",
          )
          validator_anchor = '    @field_validator("SUPPORT_USERNAME")\n'
          validators = textwrap.dedent('''
              @field_validator("BOT_TOKEN")
              @classmethod
              def validate_bot_token(cls, value: str) -> str:
                  token = value.strip()
                  if re.fullmatch(r"[0-9]+:[A-Za-z0-9_-]+", token) is None:
                      raise ValueError("BOT_TOKEN has invalid format")
                  return token

              @field_validator("ADMIN_IDS")
              @classmethod
              def validate_admin_ids(cls, value: List[int]) -> List[int]:
                  if not value or any(item <= 0 for item in value):
                      raise ValueError("ADMIN_IDS must contain positive Telegram IDs")
                  return value

              @field_validator(
                  "DATABASE_URL",
                  "DB_ENCRYPTION_KEY",
                  "REDIS_URL",
                  "REDIS_PASSWORD",
                  "YOOKASSA_SHOP_ID",
                  "YOOKASSA_SECRET_KEY",
                  "YOOKASSA_RETURN_URL",
              )
              @classmethod
              def validate_required_value(cls, value: str) -> str:
                  normalized = value.strip()
                  if not normalized or "change_me" in normalized.lower():
                      raise ValueError("required production setting is empty or placeholder")
                  return normalized

              @field_validator("DOMAIN")
              @classmethod
              def validate_domain(cls, value: str) -> str:
                  domain = value.strip().lower().rstrip(".")
                  labels = domain.split(".")
                  label_pattern = re.compile(
                      r"^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
                  )
                  if (
                      not domain
                      or len(domain) > 253
                      or len(labels) < 2
                      or any(label_pattern.fullmatch(label) is None for label in labels)
                  ):
                      raise ValueError("DOMAIN must be a valid public hostname")
                  return domain

              @field_validator("SSL_EMAIL")
              @classmethod
              def validate_ssl_email(cls, value: str) -> str:
                  email = value.strip().lower()
                  if (
                      not email
                      or email in {"admin@example.com", "change_me@example.com"}
                      or re.fullmatch(r"[^@\\s]+@[^@\\s]+\\.[^@\\s]+", email) is None
                  ):
                      raise ValueError("SSL_EMAIL must be a real certificate email")
                  return email

              @field_validator("YOOKASSA_WEBHOOK_PORT")
              @classmethod
              def validate_webhook_port(cls, value: int) -> int:
                  if value < 1 or value > 65535:
                      raise ValueError("YOOKASSA_WEBHOOK_PORT must be between 1 and 65535")
                  return value

          ''').replace("\n", "\n    ").lstrip("    ")
          text = replace_exact(text, validator_anchor, validators + validator_anchor, "runtime validators")
          path.write_text(text, encoding="utf-8")

          # Runtime startup: webhook is unconditional and fatal startup errors exit non-zero.
          path = Path("bot/main.py")
          text = path.read_text(encoding="utf-8")
          text = replace_between(
              text,
              '        if settings.YOOKASSA_SHOP_ID and not settings.YOOKASSA_SECRET_KEY:\n',
              '        logger.info("Инициализация БД...")\n',
              '        logger.info("Инициализация БД...")\n',
              "remove optional YooKassa startup branches",
          )
          text = replace_exact(
              text,
              '        if settings.YOOKASSA_SHOP_ID and settings.YOOKASSA_SECRET_KEY:\n            webhook_runner = await start_webhook_server(\n                settings.YOOKASSA_WEBHOOK_PORT\n            )\n',
              '        webhook_runner = await start_webhook_server(\n            settings.YOOKASSA_WEBHOOK_PORT\n        )\n',
              "unconditional webhook startup",
          )
          text = replace_exact(
              text,
              '    except Exception as e:\n        logger.critical("Fatal error in main: %s", e, exc_info=True)\n\n    finally:\n',
              '    except Exception as e:\n        logger.critical("Fatal error in main: %s", e, exc_info=True)\n        raise\n\n    finally:\n',
              "fatal startup exit status",
          )
          path.write_text(text, encoding="utf-8")

          # Installer core: existing .env and first install both require the full payment contract.
          path = Path("scripts/lib/deploy_core.inc")
          text = path.read_text(encoding="utf-8")
          validate_env = textwrap.dedent(r'''validate_env_file() {
              validate_env_file_safety || return 1

              local required value
              for required in \
                  BOT_TOKEN ADMIN_IDS SUPPORT_USERNAME DATABASE_URL \
                  REDIS_URL REDIS_PASSWORD DB_ENCRYPTION_KEY \
                  YOOKASSA_SHOP_ID YOOKASSA_SECRET_KEY \
                  YOOKASSA_RETURN_URL YOOKASSA_WEBHOOK_PORT DOMAIN SSL_EMAIL; do
                  value=$(read_env_value "$required")
                  if [[ -z "$value" ]]; then
                      error "В production .env отсутствует обязательный параметр: $required"
                      return 1
                  fi
              done

              local bot_token support_username admin_ids encryption_key
              local shop_id secret_key domain ssl_email webhook_port

              bot_token=$(read_env_value BOT_TOKEN)
              if [[ ! "$bot_token" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
                  error "BOT_TOKEN в production .env имеет неверный формат"
                  return 1
              fi

              support_username=$(read_env_value SUPPORT_USERNAME)
              support_username=${support_username#@}
              if [[ ! "$support_username" =~ ^[A-Za-z][A-Za-z0-9_]{0,31}$ ]] ||
                 [[ "${support_username,,}" == support ]] ||
                 [[ "${support_username,,}" == change_me_support_username ]]; then
                  error "SUPPORT_USERNAME в production .env должен быть реальным Telegram username"
                  return 1
              fi

              admin_ids=$(read_env_value ADMIN_IDS)
              ADMIN_IDS_JSON="$admin_ids" python3 - <<'PY_ADMIN_IDS'
          import json
          import os

          value = json.loads(os.environ["ADMIN_IDS_JSON"])
          if not isinstance(value, list) or not value:
              raise SystemExit("ADMIN_IDS must be a non-empty JSON array")
          if any(not isinstance(item, int) or isinstance(item, bool) or item <= 0 for item in value):
              raise SystemExit("ADMIN_IDS must contain positive integers")
          PY_ADMIN_IDS

              encryption_key=$(read_env_value DB_ENCRYPTION_KEY)
              DB_KEY="$encryption_key" python3 - <<'PY_DB_KEY'
          import base64
          import os

          key = os.environ["DB_KEY"].encode("ascii")
          try:
              decoded = base64.urlsafe_b64decode(key)
          except Exception as exc:
              raise SystemExit(f"invalid DB_ENCRYPTION_KEY: {type(exc).__name__}")
          if len(decoded) != 32:
              raise SystemExit("invalid DB_ENCRYPTION_KEY length")
          PY_DB_KEY

              shop_id=$(read_env_value YOOKASSA_SHOP_ID)
              secret_key=$(read_env_value YOOKASSA_SECRET_KEY)
              if [[ "${shop_id,,}" == *change_me* || "${secret_key,,}" == *change_me* ]]; then
                  error "YooKassa credentials в production .env содержат placeholder"
                  return 1
              fi

              domain=$(read_env_value DOMAIN)
              if ! normalize_domain "$domain" >/dev/null; then
                  error "DOMAIN в production .env имеет неверный формат"
                  return 1
              fi

              ssl_email=$(read_env_value SSL_EMAIL)
              if ! validate_email "$ssl_email"; then
                  error "SSL_EMAIL в production .env должен быть реальным email"
                  return 1
              fi

              webhook_port=$(read_env_value YOOKASSA_WEBHOOK_PORT)
              if [[ ! "$webhook_port" =~ ^[1-9][0-9]{0,4}$ ]] || (( webhook_port > 65535 )); then
                  error "YOOKASSA_WEBHOOK_PORT в production .env имеет неверный формат"
                  return 1
              fi
          }

          ''')
          text = replace_between(text, "validate_env_file() {\n", "determine_install_kind() {\n", validate_env, "validate_env_file")

          collect_input = textwrap.dedent(r'''collect_initial_input() {
              if [[ "$NON_INTERACTIVE" == true ]]; then
                  BOT_TOKEN=${BOT_TOKEN:?BOT_TOKEN не задан}
                  DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD не задан}
                  REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD не задан}
                  ADMIN_IDS=${ADMIN_IDS:?ADMIN_IDS не задан}
                  SUPPORT_USERNAME=${SUPPORT_USERNAME:?SUPPORT_USERNAME не задан}
                  YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:?YOOKASSA_SHOP_ID не задан}
                  YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:?YOOKASSA_SECRET_KEY не задан}
                  YOOKASSA_RETURN_URL=${YOOKASSA_RETURN_URL:-https://t.me/{bot_username}}
                  YOOKASSA_WEBHOOK_PORT=${YOOKASSA_WEBHOOK_PORT:-8080}
                  DOMAIN=${DOMAIN:?DOMAIN не задан}
                  SSL_EMAIL=${SSL_EMAIL:?SSL_EMAIL не задан}
                  DB_ENCRYPTION_KEY=${DB_ENCRYPTION_KEY:-}
                  return
              fi

              info "=== Первичная конфигурация ==="
              read_bot_token
              read_db_password 'Пароль PostgreSQL: ' DB_PASSWORD
              read_db_password 'Пароль Redis: ' REDIS_PASSWORD
              read_admin_ids
              read_support_username

              while [[ -z "${YOOKASSA_SHOP_ID:-}" ]]; do
                  read_optional 'YooKassa Shop ID' YOOKASSA_SHOP_ID ''
                  [[ -n "$YOOKASSA_SHOP_ID" ]] || printf 'YooKassa Shop ID обязателен.\n'
              done
              while [[ -z "${YOOKASSA_SECRET_KEY:-}" ]]; do
                  read_optional_secret 'YooKassa Secret Key' YOOKASSA_SECRET_KEY ''
                  [[ -n "$YOOKASSA_SECRET_KEY" ]] || printf 'YooKassa Secret Key обязателен.\n'
              done
              YOOKASSA_RETURN_URL='https://t.me/{bot_username}'
              YOOKASSA_WEBHOOK_PORT=8080

              while true; do
                  read_optional 'Публичный домен для YooKassa webhook/health' DOMAIN ''
                  if normalized_domain=$(normalize_domain "$DOMAIN"); then
                      DOMAIN=$normalized_domain
                      break
                  fi
                  printf 'Укажите корректный публичный домен.\n'
              done
              while true; do
                  read_optional 'Email для сертификата Let’s Encrypt' SSL_EMAIL ''
                  if validate_email "$SSL_EMAIL"; then
                      break
                  fi
                  printf 'Укажите реальный email для сертификата.\n'
              done
          }

          ''')
          text = replace_between(text, "collect_initial_input() {\n", "normalize_domain() {\n", collect_input, "collect_initial_input")

          validate_initial = textwrap.dedent(r'''validate_initial_input() {
              if [[ ! "$BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]]; then
                  error "BOT_TOKEN имеет неверный формат"
                  return 1
              fi
              if [[ ! "$DB_PASSWORD" =~ ^[A-Za-z0-9_@%*+=-]{8,}$ ]]; then
                  error "DB_PASSWORD имеет неверный формат"
                  return 1
              fi
              if [[ ! "$REDIS_PASSWORD" =~ ^[A-Za-z0-9_@%*+=-]{8,}$ ]]; then
                  error "REDIS_PASSWORD имеет неверный формат"
                  return 1
              fi
              if [[ ! "$ADMIN_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
                  error "ADMIN_IDS имеет неверный формат"
                  return 1
              fi

              SUPPORT_USERNAME=${SUPPORT_USERNAME#@}
              if [[ ! "$SUPPORT_USERNAME" =~ ^[A-Za-z][A-Za-z0-9_]{0,31}$ ]] ||
                 [[ "${SUPPORT_USERNAME,,}" == support ]] ||
                 [[ "${SUPPORT_USERNAME,,}" == change_me_support_username ]]; then
                  error "SUPPORT_USERNAME должен быть реальным Telegram username"
                  return 1
              fi

              if [[ -z "$YOOKASSA_SHOP_ID" || -z "$YOOKASSA_SECRET_KEY" ]]; then
                  error "YOOKASSA_SHOP_ID и YOOKASSA_SECRET_KEY обязательны"
                  return 1
              fi
              if [[ "${YOOKASSA_SHOP_ID,,}" == *change_me* || "${YOOKASSA_SECRET_KEY,,}" == *change_me* ]]; then
                  error "YooKassa credentials не должны содержать placeholder"
                  return 1
              fi

              local normalized_domain
              if ! normalized_domain=$(normalize_domain "$DOMAIN"); then
                  error "DOMAIN обязателен и должен быть корректным публичным доменом"
                  return 1
              fi
              DOMAIN=$normalized_domain

              if ! validate_email "$SSL_EMAIL"; then
                  error "SSL_EMAIL обязателен и должен быть реальным email для Let's Encrypt"
                  return 1
              fi

              if [[ ! "$YOOKASSA_WEBHOOK_PORT" =~ ^[1-9][0-9]{0,4}$ ]] ||
                 (( YOOKASSA_WEBHOOK_PORT > 65535 )); then
                  error "YOOKASSA_WEBHOOK_PORT имеет неверный формат"
                  return 1
              fi
          }

          ''')
          text = replace_between(text, "validate_initial_input() {\n", "install_dependencies() {\n", validate_initial, "validate_initial_input")
          text = replace_exact(
              text,
              '    if [[ -n "$DOMAIN" ]]; then\n        write_env_var DOMAIN "$DOMAIN"\n    fi\n',
              '    write_env_var DOMAIN "$DOMAIN"\n    write_env_var SSL_EMAIL "$SSL_EMAIL"\n',
              "core writes domain and email",
          )
          path.write_text(text, encoding="utf-8")

          # Production adapter has its own create_env override.
          path = Path("scripts/deploy.sh")
          text = path.read_text(encoding="utf-8")
          text = replace_exact(
              text,
              '    if [[ -n "$DOMAIN" ]]; then\n        write_env_var DOMAIN "$DOMAIN"\n    fi\n',
              '    write_env_var DOMAIN "$DOMAIN"\n    write_env_var SSL_EMAIL "$SSL_EMAIL"\n',
              "adapter writes domain and email",
          )
          path.write_text(text, encoding="utf-8")

          # CI must provide the same required runtime contract.
          path = Path(".github/workflows/tests.yml")
          text = path.read_text(encoding="utf-8")
          text = replace_exact(
              text,
              '      SUPPORT_USERNAME: "test_support_bot"\n',
              '      SUPPORT_USERNAME: "test_support_bot"\n      ADMIN_IDS: "[123456789]"\n      REDIS_URL: "redis://:ci_redis_password@localhost:6379/0"\n      REDIS_PASSWORD: "ci_redis_password"\n      YOOKASSA_SHOP_ID: "123456"\n      YOOKASSA_SECRET_KEY: "ci_test_secret"\n      YOOKASSA_RETURN_URL: "https://t.me/{bot_username}"\n      YOOKASSA_WEBHOOK_PORT: "8080"\n      DOMAIN: "vpn.example.test"\n      SSL_EMAIL: "ci@example.test"\n',
              "CI required config",
          )
          path.write_text(text, encoding="utf-8")

          # Installer regression tests.
          path = Path("tests/test_installer_input_contract.py")
          text = path.read_text(encoding="utf-8")
          old_method = '''    def test_valid_install_input_does_not_need_amnezia_values(self):
              result = self.run_function(
                  "BOT_TOKEN='123456:TEST_TOKEN'; "
                  "DB_PASSWORD='password1'; REDIS_PASSWORD='password2'; "
                  "ADMIN_IDS='123'; SUPPORT_USERNAME='test_support_bot'; "
                  "YOOKASSA_SHOP_ID=''; YOOKASSA_SECRET_KEY=''; "
                  "DOMAIN=''; SSL_EMAIL=''; validate_initial_input"
              )
              self.assertEqual(result.returncode, 0, result.stdout + result.stderr)

          '''
          new_method = '''    def test_valid_install_input_requires_payment_contract_but_not_amnezia(self):
              result = self.run_function(
                  "BOT_TOKEN='123456:TEST_TOKEN'; "
                  "DB_PASSWORD='password1'; REDIS_PASSWORD='password2'; "
                  "ADMIN_IDS='123'; SUPPORT_USERNAME='test_support_bot'; "
                  "YOOKASSA_SHOP_ID='123456'; YOOKASSA_SECRET_KEY='secret'; "
                  "YOOKASSA_RETURN_URL='https://t.me/{bot_username}'; "
                  "YOOKASSA_WEBHOOK_PORT='8080'; "
                  "DOMAIN='vpn.example.test'; SSL_EMAIL='owner@example.test'; "
                  "validate_initial_input"
              )
              self.assertEqual(result.returncode, 0, result.stdout + result.stderr)

              source = CORE.read_text(encoding="utf-8")
              self.assertNotIn("Enter — отключено", source)
              self.assertNotIn("YooKassa отключена", source)

              for missing_assignment, expected in (
                  ("YOOKASSA_SHOP_ID='';", "YOOKASSA"),
                  ("YOOKASSA_SECRET_KEY='';", "YOOKASSA"),
                  ("DOMAIN='';", "DOMAIN"),
                  ("SSL_EMAIL='';", "SSL_EMAIL"),
              ):
                  with self.subTest(missing_assignment=missing_assignment):
                      command = (
                          "BOT_TOKEN='123456:TEST_TOKEN'; "
                          "DB_PASSWORD='password1'; REDIS_PASSWORD='password2'; "
                          "ADMIN_IDS='123'; SUPPORT_USERNAME='test_support_bot'; "
                          "YOOKASSA_SHOP_ID='123456'; YOOKASSA_SECRET_KEY='secret'; "
                          "YOOKASSA_RETURN_URL='https://t.me/{bot_username}'; "
                          "YOOKASSA_WEBHOOK_PORT='8080'; "
                          "DOMAIN='vpn.example.test'; SSL_EMAIL='owner@example.test'; "
                          + missing_assignment
                          + " validate_initial_input"
                      )
                      missing_result = self.run_function(command)
                      self.assertNotEqual(missing_result.returncode, 0)
                      self.assertIn(expected, missing_result.stderr)

          '''
          text = replace_exact(text, old_method, new_method, "installer valid and missing tests")
          env_anchor = '                \'DB_ENCRYPTION_KEY="MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="\\n\',\n'
          env_addition = env_anchor + (
              '                \'REDIS_PASSWORD="password2"\\n\'\n'
              '                \'YOOKASSA_SHOP_ID="123456"\\n\'\n'
              '                \'YOOKASSA_SECRET_KEY="secret"\\n\'\n'
              '                \'YOOKASSA_RETURN_URL="https://t.me/test_bot"\\n\'\n'
              '                \'YOOKASSA_WEBHOOK_PORT="8080"\\n\'\n'
              '                \'DOMAIN="vpn.example.test"\\n\'\n'
              '                \'SSL_EMAIL="owner@example.test"\\n\',\n'
          )
          text = replace_exact(text, env_anchor, env_addition, "existing env full contract")
          path.write_text(text, encoding="utf-8")

          # Runtime settings contract tests.
          Path("tests/test_runtime_config_contract.py").write_text(textwrap.dedent('''
              import os
              import unittest
              from pathlib import Path
              from unittest.mock import patch

              from pydantic import ValidationError

              from config.settings import Settings


              ROOT = Path(__file__).resolve().parents[1]

              BASE = {
                  "BOT_TOKEN": "123456:TEST_TOKEN",
                  "ADMIN_IDS": [123456789],
                  "SUPPORT_USERNAME": "test_support_bot",
                  "DATABASE_URL": "postgresql+asyncpg://u:p@127.0.0.1:5432/db",
                  "DB_ENCRYPTION_KEY": "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=",
                  "REDIS_URL": "redis://:password2@127.0.0.1:6379/0",
                  "REDIS_PASSWORD": "password2",
                  "YOOKASSA_SHOP_ID": "123456",
                  "YOOKASSA_SECRET_KEY": "test_secret",
                  "YOOKASSA_RETURN_URL": "https://t.me/{bot_username}",
                  "YOOKASSA_WEBHOOK_PORT": 8080,
                  "DOMAIN": "vpn.example.test",
                  "SSL_EMAIL": "owner@example.test",
              }


              class RuntimeConfigContractTests(unittest.TestCase):
                  def build(self, data):
                      with patch.dict(os.environ, {}, clear=True):
                          return Settings(_env_file=None, **data)

                  def test_complete_config_is_valid(self):
                      settings = self.build(dict(BASE))
                      self.assertEqual(settings.DOMAIN, "vpn.example.test")

                  def test_missing_critical_settings_fail(self):
                      for key in (
                          "ADMIN_IDS",
                          "REDIS_URL",
                          "REDIS_PASSWORD",
                          "YOOKASSA_SHOP_ID",
                          "YOOKASSA_SECRET_KEY",
                          "YOOKASSA_RETURN_URL",
                          "YOOKASSA_WEBHOOK_PORT",
                          "DOMAIN",
                          "SSL_EMAIL",
                      ):
                          with self.subTest(key=key):
                              data = dict(BASE)
                              data.pop(key)
                              with self.assertRaises(ValidationError):
                                  self.build(data)

                  def test_empty_payment_contract_fails(self):
                      for key in (
                          "YOOKASSA_SHOP_ID",
                          "YOOKASSA_SECRET_KEY",
                          "DOMAIN",
                          "SSL_EMAIL",
                      ):
                          with self.subTest(key=key):
                              data = dict(BASE)
                              data[key] = ""
                              with self.assertRaises(ValidationError):
                                  self.build(data)

                  def test_empty_admin_ids_fail(self):
                      data = dict(BASE)
                      data["ADMIN_IDS"] = []
                      with self.assertRaises(ValidationError):
                          self.build(data)

                  def test_main_has_no_payment_disabled_startup_mode(self):
                      source = (ROOT / "bot" / "main.py").read_text(encoding="utf-8")
                      self.assertNotIn(
                          "if settings.YOOKASSA_SHOP_ID and settings.YOOKASSA_SECRET_KEY",
                          source,
                      )
                      self.assertIn("webhook_runner = await start_webhook_server", source)
                      self.assertIn(
                          'logger.critical("Fatal error in main: %s", e, exc_info=True)\\n        raise',
                          source,
                      )


              if __name__ == "__main__":
                  unittest.main()
          ''').lstrip(), encoding="utf-8")

          # Existing rollback fixture must now provide the full required contract.
          path = Path("tests/test_deploy_rollback.py")
          text = path.read_text(encoding="utf-8")
          text = replace_exact(
              text,
              'command = f\'ENV_FILE="{envfile}"; BOT_TOKEN=123456:TEST_TOKEN; DB_PASSWORD=password1; REDIS_PASSWORD=password2; ADMIN_IDS=1; SUPPORT_USERNAME=test_support_bot; YOOKASSA_SHOP_ID=; YOOKASSA_SECRET_KEY=; DOMAIN=; create_env_if_missing\'',
              'command = f\'ENV_FILE="{envfile}"; BOT_TOKEN=123456:TEST_TOKEN; DB_PASSWORD=password1; REDIS_PASSWORD=password2; ADMIN_IDS=1; SUPPORT_USERNAME=test_support_bot; YOOKASSA_SHOP_ID=123456; YOOKASSA_SECRET_KEY=test_secret; YOOKASSA_RETURN_URL=https://t.me/test_bot; YOOKASSA_WEBHOOK_PORT=8080; DOMAIN=vpn.example.test; SSL_EMAIL=owner@example.test; create_env_if_missing\'',
              "rollback initial env fixture",
          )
          path.write_text(text, encoding="utf-8")

          # Documentation and sample configuration must not advertise a disabled mode.
          path = Path(".env.example")
          text = path.read_text(encoding="utf-8")
          text = replace_exact(
              text,
              '# Опционально: пароль Redis как отдельная переменная.\n# Используется deploy.sh, но не обязателен для самого бота,\n# если REDIS_URL уже содержит пароль.\nREDIS_PASSWORD=\'CHANGE_ME_REDIS_PASSWORD\'\n',
              '# Обязательный пароль Redis. Значение должно совпадать с паролем в REDIS_URL.\nREDIS_PASSWORD=\'CHANGE_ME_REDIS_PASSWORD\'\n',
              "Redis documentation required",
          )
          text = replace_exact(
              text,
              "# Оставьте оба значения пустыми, чтобы отключить платежи.\nYOOKASSA_SHOP_ID=''\nYOOKASSA_SECRET_KEY=''\nYOOKASSA_RETURN_URL='https://t.me/{bot_username}'\nYOOKASSA_WEBHOOK_PORT=8080\n",
              "# Обязательные production-реквизиты YooKassa.\nYOOKASSA_SHOP_ID='CHANGE_ME_YOOKASSA_SHOP_ID'\nYOOKASSA_SECRET_KEY='CHANGE_ME_YOOKASSA_SECRET_KEY'\nYOOKASSA_RETURN_URL='https://t.me/{bot_username}'\nYOOKASSA_WEBHOOK_PORT=8080\n\n# Обязательный публичный HTTPS-домен для webhook и health endpoint.\nDOMAIN='vpn.example.com'\n\n# Обязательный реальный email для выпуска и продления TLS-сертификата.\nSSL_EMAIL='owner@example.com'\n",
              "YooKassa sample required",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = replace_exact(
              text,
              'REDIS_PASSWORD=password\n\nYOOKASSA_SHOP_ID=\nYOOKASSA_SECRET_KEY=\nYOOKASSA_RETURN_URL=https://t.me/{bot_username}\nYOOKASSA_WEBHOOK_PORT=8080\n',
              'REDIS_PASSWORD=password\n\nYOOKASSA_SHOP_ID=<shop id>\nYOOKASSA_SECRET_KEY=<secret key>\nYOOKASSA_RETURN_URL=https://t.me/{bot_username}\nYOOKASSA_WEBHOOK_PORT=8080\nDOMAIN=vpn.example.com\nSSL_EMAIL=owner@example.com\n',
              "README minimal env",
          )
          text = replace_exact(
              text,
              'Неинтерактивный вариант без необязательных платежей и публичного домена:\n',
              'Неинтерактивный вариант с обязательной YooKassa и публичным HTTPS-доменом:\n',
              "README install heading",
          )
          text = replace_exact(
              text,
              "  DOMAIN='' \\\n  SSL_EMAIL='' \\\n  YOOKASSA_SHOP_ID='' \\\n  YOOKASSA_SECRET_KEY='' \\\n",
              "  DOMAIN='vpn.example.com' \\\n  SSL_EMAIL='owner@example.com' \\\n  YOOKASSA_SHOP_ID='...' \\\n  YOOKASSA_SECRET_KEY='...' \\\n",
              "README install example",
          )
          text = replace_exact(
              text,
              'Amnezia API URL и ключ при установке бота не запрашиваются. Каждый VPN-сервер добавляется после запуска через Telegram-админку, а его API key хранится в PostgreSQL в зашифрованном виде. Если указан `DOMAIN`, требуется реальный `SSL_EMAIL`; placeholder `admin@example.com` не принимается.\n\n`DOMAIN` имеет смысл только вместе с YooKassa. Nginx публикует только:\n',
              'Amnezia API URL и ключ при установке бота не запрашиваются. Каждый VPN-сервер добавляется после запуска через Telegram-админку, а его API key хранится в PostgreSQL в зашифрованном виде.\n\n`YOOKASSA_SHOP_ID`, `YOOKASSA_SECRET_KEY`, `DOMAIN` и `SSL_EMAIL` обязательны. Без любого из этих значений установщик и приложение завершаются ошибкой; режима работы без платежей нет. Nginx публикует только:\n',
              "README required contract",
          )
          yk_anchor = '# YooKassa\n\nYooKassa используется только для пополнения внутреннего рублёвого баланса.'
          text = replace_exact(
              text,
              yk_anchor,
              '# YooKassa\n\nYooKassa является обязательной частью продукта: без Shop ID, Secret Key, публичного домена и email сертификата бот не запускается.\n\nYooKassa используется только для пополнения внутреннего рублёвого баланса.',
              "README YooKassa mandatory",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run targeted checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt --quiet
          bash -n deploy.sh scripts/deploy.sh scripts/deploy_full.sh scripts/deploy_full_library.sh scripts/lib/deploy_core.inc
          shellcheck --severity=error deploy.sh scripts/deploy.sh scripts/deploy_full.sh scripts/deploy_full_library.sh
          python -m unittest discover -s tests -p 'test_installer_input_contract.py' -v
          python -m unittest discover -s tests -p 'test_runtime_config_contract.py' -v
          python -m unittest discover -s tests -p 'test_deploy_rollback.py' -v
          git diff --check

      - name: Commit verified changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-required-yookassa-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: require complete YooKassa production configuration'
          git pull --rebase origin agent/greenfield-ui-ux-cleanup
          git push origin HEAD:agent/greenfield-ui-ux-cleanup
