name: requirements-lock

on:
  workflow_dispatch:
  push:
    paths:
      - requirements.txt
      - requirements.lock
      - .github/workflows/requirements-lock.yml
  pull_request:
    paths:
      - requirements.txt
      - requirements.lock
      - .github/workflows/requirements-lock.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Regenerate deterministic hash lock
        run: |
          python -m pip install 'pip==25.3' 'pip-tools==7.5.2'
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --allow-unsafe \
            --strip-extras \
            --output-file /tmp/requirements.lock \
            requirements.txt
      - name: Verify committed lock is current
        run: |
          grep -v '^#' requirements.lock > /tmp/req_repo.txt
          grep -v '^#' /tmp/requirements.lock > /tmp/req_ci.txt
          diff -u /tmp/req_repo.txt /tmp/req_ci.txt > /tmp/diff.txt || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: diff-requirements-lock
          path: /tmp/diff.txt
      - name: Fail if diff exists
        run: |
          if [ -s /tmp/diff.txt ]; then
            echo "Lockfile is out of date. Check the diff-requirements-lock artifact."
            exit 1
          fi
      - name: Verify locked installation
        run: |
          python -m venv /tmp/lock-check
          /tmp/lock-check/bin/python -m pip install 'pip==25.3'
          /tmp/lock-check/bin/python -m pip install --require-hashes -r requirements.lock
