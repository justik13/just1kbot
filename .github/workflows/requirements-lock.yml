name: requirements-lock

on:
  workflow_dispatch:
  push:
    paths:
      - requirements.txt
      - .github/workflows/requirements-lock.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Generate hash-locked dependencies
        run: |
          python -m pip install --upgrade pip pip-tools
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --allow-unsafe \
            --output-file requirements.lock \
            requirements.txt
      - name: Verify locked installation
        run: |
          python -m venv /tmp/lock-check
          /tmp/lock-check/bin/python -m pip install --require-hashes -r requirements.lock
      - uses: actions/upload-artifact@v4
        with:
          name: requirements-lock-${{ github.sha }}
          path: requirements.lock
          if-no-files-found: error
