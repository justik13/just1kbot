name: requirements-lock

on:
  workflow_dispatch:
  push:
    branches:
      - agent/installer-safety-foundation

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Generate hash-locked dependencies
        run: |
          python -m pip install 'pip==25.3' 'pip-tools==7.5.2'
          python -m piptools compile \
            --resolver=backtracking \
            --generate-hashes \
            --allow-unsafe \
            --strip-extras \
            --output-file /tmp/requirements.lock \
            requirements.txt
      - name: Verify locked installation
        run: |
          python -m venv /tmp/lock-check
          /tmp/lock-check/bin/python -m pip install 'pip==25.3'
          /tmp/lock-check/bin/python -m pip install --require-hashes -r /tmp/requirements.lock
      - name: Commit deterministic lock
        run: |
          cp /tmp/requirements.lock requirements.lock
          git add requirements.lock
          if git diff --cached --quiet; then
            echo 'requirements.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh deterministic requirements lock'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: requirements-lock-${{ github.sha }}
          path: /tmp/requirements.lock
          if-no-files-found: error
          retention-days: 7
