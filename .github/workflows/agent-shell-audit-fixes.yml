name: agent shell audit fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/shell-safety-audit-fixes'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectx
          POSTGRES_PASSWORD: projectx
          POSTGRES_DB: projectx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectx -d projectx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://projectx:projectx@localhost:5432/projectx_test
      TEST_DATABASE_URL: postgresql+asyncpg://projectx:projectx@localhost:5432/projectx_test
      DB_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      BOT_TOKEN: "123456:TEST_ONLY_NOT_A_REAL_TOKEN"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Apply audited shell fixes
        run: |
          cat .github/agent/apply_shell_audit_fixes.py.gz.b64.part* > /tmp/apply_shell_audit_fixes.py.gz.b64
          base64 -d /tmp/apply_shell_audit_fixes.py.gz.b64 > /tmp/apply_shell_audit_fixes.py.gz
          echo "549a83682054a6bc85b5b082ba8d5ac0105977cccfef35aa773ac19c298e223f  /tmp/apply_shell_audit_fixes.py.gz" | sha256sum -c -
          gzip -dc /tmp/apply_shell_audit_fixes.py.gz > /tmp/apply_shell_audit_fixes.py
          python /tmp/apply_shell_audit_fixes.py

      - name: Preserve function-only restore mode
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/lib/production_restore_recovery.sh")
          text = path.read_text(encoding="utf-8")
          old = 'JOURNAL_FILE=${RESTORE_JOURNAL_FILE:-$STATE_DIR/cutover-journal.env}\n\n_base_show_status_definition'
          new = 'JOURNAL_FILE=${RESTORE_JOURNAL_FILE:-$STATE_DIR/cutover-journal.env}\nRESTORE_FUNCTIONS_ONLY_MODE=${RESTORE_FUNCTIONS_ONLY:-0}\n\n_base_show_status_definition'
          if text.count(old) != 1:
              raise SystemExit("unexpected recovery journal header")
          text = text.replace(old, new)
          old = '[[ "${RESTORE_FUNCTIONS_ONLY:-0}" != 1 || "${RESTORE_TEST_JOURNAL:-0}" == 1 ]]'
          new = '[[ "$RESTORE_FUNCTIONS_ONLY_MODE" != 1 || "${RESTORE_TEST_JOURNAL:-0}" == 1 ]]'
          if text.count(old) != 1:
              raise SystemExit("unexpected journal_enabled implementation")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client shellcheck
          python -m pip install -r requirements.txt

      - name: Validate shell and repository tests
        env:
          RUN_BACKUP_INTEGRATION: "1"
          BACKUP_TEST_DATABASE_URL: postgresql://projectx:projectx@localhost:5432/projectx_test
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find . -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
          alembic upgrade head
          python -m unittest discover -s tests -v
          alembic downgrade -1
          alembic upgrade head
          git diff --check

      - name: Commit validated fixes
        run: |
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          git commit -m "fix shell operation safety"
          git push origin "HEAD:${{ github.head_ref }}"
