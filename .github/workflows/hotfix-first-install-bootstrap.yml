name: apply first-install hotfix

on:
  push:
    branches:
      - agent/hotfix-first-install-rollback
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hotfix-first-install-rollback
          fetch-depth: 0

      - name: Apply hotfix patch
        run: |
          git apply --recount --check .github/hotfix-first-install.patch
          git apply --recount .github/hotfix-first-install.patch
          rm -f .github/hotfix-first-install.patch
          rm -f .github/.hotfix-trigger .github/.hotfix-trigger-2
          rm -f .github/workflows/hotfix-first-install-bootstrap.yml

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell changes
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/uninstall.sh
          shellcheck --severity=error scripts/deploy.sh scripts/uninstall.sh
          git diff --check

      - name: Run targeted regression tests
        run: |
          python -m unittest discover -s tests -p 'test_shell_layout.py' -v
          python -m unittest discover -s tests -p 'test_shell_stage2.py' -v

      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/deploy.sh scripts/uninstall.sh tests/test_shell_layout.py tests/test_shell_stage2.py
          git add -u .github
          git commit -m 'fix: recover failed first install safely'
          git push origin HEAD:agent/hotfix-first-install-rollback
