name: One-shot greenfield legacy cleanup

on:
  push:
    branches:
      - fix/installer-resilience-6-bugs

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'justik13/projectx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove legacy referral runtime and clean baseline schema
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          # ---- ORM runtime cleanup -------------------------------------------------
          models_path = Path("database/models.py")
          models = models_path.read_text()
          models = models.replace(
              '    referral_days: Mapped[int] = mapped_column(Integer, default=0)\n',
              '',
          )
          models = re.sub(
              r'\n    referral_processed_at: Mapped\[datetime \| None\] = mapped_column\(\n'
              r'        DateTime\(timezone=True\)\n'
              r'    \)\n',
              '\n',
              models,
          )
          models = re.sub(
              r'\nclass ReferralReward\(Base\):.*?\nclass PaymentEvent\(Base\):',
              '\nclass PaymentEvent(Base):',
              models,
              flags=re.S,
          )
          models = models.replace(
              '"entry_type IN (\'account_purchase_grant\', \'referral_user_bonus\',\n'
              '            "\'referral_referrer_bonus\', \'manual_grant\',\n'
              '            "\'tariff_change\')",',
              '"entry_type IN (\'account_purchase_grant\', \'manual_grant\', \'tariff_change\')",',
          )
          models = re.sub(
              r'        CheckConstraint\(\n'
              r'            "\(entry_type IN \(\'account_purchase_grant\', \'referral_user_bonus\',\n'
              r'            "\'referral_referrer_bonus\', \'manual_grant\'\) AND days_delta > 0 "\n'
              r'            "AND reversed_entry_id IS NULL "\n'
              r'            "AND \(hours_delta IS NULL OR hours_delta = days_delta \* 24\)\) OR "\n'
              r'            "\(entry_type = \'tariff_change\' AND source_type = \'quote\' "\n'
              r'            "AND days_delta = 0 AND hours_delta > 0 "\n'
              r'            "AND reversed_entry_id IS NULL\) OR "\n'
              r'            "\(entry_type = \'referral_reversal\' AND days_delta < 0 "\n'
              r'            "AND reversed_entry_id IS NOT NULL "\n'
              r'            "AND \(hours_delta IS NULL OR hours_delta = days_delta \* 24\)\)",\n'
              r'            name="ck_entitlement_entries_shape",\n'
              r'        \),',
              '        CheckConstraint(\n'
              '            "((entry_type IN (\'account_purchase_grant\', \'manual_grant\') "\n'
              '            "AND days_delta > 0 AND reversed_entry_id IS NULL "\n'
              '            "AND (hours_delta IS NULL OR hours_delta = days_delta * 24)) OR "\n'
              '            "(entry_type = \'tariff_change\' AND source_type = \'quote\' "\n'
              '            "AND days_delta = 0 AND hours_delta > 0 AND reversed_entry_id IS NULL))",\n'
              '            name="ck_entitlement_entries_shape",\n'
              '        ),',
              models,
              flags=re.S,
          )
          models_path.write_text(models)

          # ---- User/admin text cleanup --------------------------------------------
          user_texts_path = Path("bot/texts_data/user_texts.py")
          user_texts = user_texts_path.read_text()
          user_texts = re.sub(
              r'\n    "PROFILE_TEXT_ACTIVE": """.*?""",\n\n    "PROFILE_TEXT_INACTIVE": """.*?""",\n',
              '\n',
              user_texts,
              flags=re.S,
          )
          user_texts = re.sub(
              r'\n    "REFERRAL_TEXT": """.*?""",\n',
              '\n',
              user_texts,
              flags=re.S,
          )
          user_texts_path.write_text(user_texts)

          # ---- Greenfield baseline cleanup -----------------------------------------
          baseline_path = Path("alembic/versions/0001_clean_baseline.py")
          baseline = baseline_path.read_text()
          module = ast.parse(baseline)
          tuple_node = next(
              node.value
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "_SCHEMA_STATEMENTS" for t in node.targets)
          )
          statements = [ast.literal_eval(item) for item in tuple_node.elts]

          cleaned: list[str] = []
          for statement in statements:
              if "referral_rewards" in statement or "referral_eligibilities" in statement:
                  continue
              if statement.startswith("CREATE TABLE public.users ("):
                  statement = statement.replace(
                      "    referral_days integer NOT NULL,\\n",
                      "",
                  )
              if statement.startswith("CREATE TABLE public.tariff_quotes ("):
                  statement = statement.replace(
                      "    referral_processed_at timestamp with time zone,\\n",
                      "",
                  )
              if statement.startswith("CREATE TABLE public.entitlement_entries ("):
                  statement = statement.replace(
                      "    CONSTRAINT ck_entitlement_entries_shape CHECK (((((entry_type)::text = ANY ((ARRAY['account_purchase_grant'::character varying, 'referral_user_bonus'::character varying, 'referral_referrer_bonus'::character varying, 'manual_grant'::character varying])::text[])) AND (days_delta > 0) AND (reversed_entry_id IS NULL) AND ((hours_delta IS NULL) OR (hours_delta = (days_delta * 24)))) OR (((entry_type)::text = 'tariff_change'::text) AND ((source_type)::text = 'quote'::text) AND (days_delta = 0) AND (hours_delta > 0) AND (reversed_entry_id IS NULL)) OR (((entry_type)::text = 'referral_reversal'::text) AND (days_delta < 0) AND (reversed_entry_id IS NOT NULL) AND ((hours_delta IS NULL) OR (hours_delta = (days_delta * 24)))))),\\n",
                      "    CONSTRAINT ck_entitlement_entries_shape CHECK (((((entry_type)::text = ANY ((ARRAY['account_purchase_grant'::character varying, 'manual_grant'::character varying])::text[])) AND (days_delta > 0) AND (reversed_entry_id IS NULL) AND ((hours_delta IS NULL) OR (hours_delta = (days_delta * 24)))) OR (((entry_type)::text = 'tariff_change'::text) AND ((source_type)::text = 'quote'::text) AND (days_delta = 0) AND (hours_delta > 0) AND (reversed_entry_id IS NULL)))),\\n",
                  )
                  statement = statement.replace(
                      "    CONSTRAINT ck_entitlement_entries_type CHECK (((entry_type)::text = ANY ((ARRAY['account_purchase_grant'::character varying, 'referral_user_bonus'::character varying, 'referral_referrer_bonus'::character varying, 'referral_reversal'::character varying, 'manual_grant'::character varying, 'tariff_change'::character varying])::text[])))\\n",
                      "    CONSTRAINT ck_entitlement_entries_type CHECK (((entry_type)::text = ANY ((ARRAY['account_purchase_grant'::character varying, 'manual_grant'::character varying, 'tariff_change'::character varying])::text[])))\\n",
                  )
              cleaned.append(statement)

          prefix = baseline[: baseline.index("_SCHEMA_STATEMENTS = (")]
          suffix = "\n\ndef upgrade() -> None:\n    bind = op.get_bind()\n    bind.exec_driver_sql(\"SET LOCAL check_function_bodies = false\")\n    for statement in _SCHEMA_STATEMENTS:\n        bind.exec_driver_sql(statement)\n\ndef downgrade() -> None:\n    bind = op.get_bind()\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.provider_refund_operations CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.payment_disputes CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.account_ledger_allocations CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.payment_refunds CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.payment_provider_operations CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.payment_events CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.paid_value_ledger CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.api_operations CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.account_ledger_entries CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.account_balance_reservations CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.vpn_profiles CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.tariff_quotes CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.payments CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.entitlement_entries CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.users CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.tariff_versions CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.webhook_inbox CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.tariffs CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.servers CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.maintenance_mode CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.hub_messages CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.broadcast_progress CASCADE\")\n    bind.exec_driver_sql(\"DROP TABLE IF EXISTS public.audit_logs CASCADE\")\n    bind.exec_driver_sql(\"DROP FUNCTION IF EXISTS public.validate_account_allocation() CASCADE\")\n    bind.exec_driver_sql(\"DROP FUNCTION IF EXISTS public.reject_tariff_version_history_change() CASCADE\")\n    bind.exec_driver_sql(\"DROP FUNCTION IF EXISTS public.reject_quote_economic_change() CASCADE\")\n    bind.exec_driver_sql(\"DROP FUNCTION IF EXISTS public.reject_ledger_change() CASCADE\")\n    bind.exec_driver_sql(\"DROP FUNCTION IF EXISTS public.reject_entitlement_history_change() CASCADE\")\n    bind.exec_driver_sql(\"DROP FUNCTION IF EXISTS public.reject_account_ledger_change() CASCADE\")\n    bind.exec_driver_sql(\"DROP FUNCTION IF EXISTS public.reject_account_allocation_change() CASCADE\")\n    bind.exec_driver_sql(\"DROP FUNCTION IF EXISTS public.protect_account_reservation_identity() CASCADE\")\n    bind.exec_driver_sql(\"DROP FUNCTION IF EXISTS public.is_nonnegative_integer_json_array(value jsonb) CASCADE\")\n"
          baseline_path.write_text(
              prefix
              + "_SCHEMA_STATEMENTS = (\n"
              + "\n".join("    " + repr(item) + "," for item in cleaned)
              + "\n)"
              + suffix
          )
          PY

      - name: Remove one-shot workflow and commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/one-shot-clean-referral-legacy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/models.py bot/texts_data/user_texts.py alembic/versions/0001_clean_baseline.py .github/workflows/one-shot-clean-referral-legacy.yml
          git diff --cached --check
          git commit -m "refactor: remove legacy referral schema from greenfield baseline"
          git push
