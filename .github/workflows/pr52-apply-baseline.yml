name: PR52 validate clean baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr52-clean-baseline
  cancel-in-progress: true

jobs:
  apply-validate-publish:
    if: github.event.pull_request.head.ref == 'feature/yookassa-account-balance'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectx
          POSTGRES_PASSWORD: projectx
          POSTGRES_DB: projectx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectx -d projectx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://projectx:projectx@localhost:5432/projectx_test
      TEST_DATABASE_URL: postgresql+asyncpg://projectx:projectx@localhost:5432/projectx_test
      DB_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      BOT_TOKEN: "123456:TEST_ONLY_NOT_A_REAL_TOKEN"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/yookassa-account-balance
          fetch-depth: 0

      - name: Reassemble and verify reviewed cleanup
        run: |
          cat .github/pr52-baseline-chunks/part-* > /tmp/pr52-baseline.b64
          printf '%s  %s\n' \
            'df0acb3aeb8151ba6ddc474326e374459734a22cb2ae6271131b91895cdfef14' \
            '/tmp/pr52-baseline.b64' | sha256sum --check
          base64 --decode /tmp/pr52-baseline.b64 > /tmp/pr52-baseline.patch.gz
          printf '%s  %s\n' \
            '98784170f8e001b0763323dca060d958809911197e0882146a99fca8fc7ed8ac' \
            '/tmp/pr52-baseline.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/pr52-baseline.patch.gz > /tmp/pr52-baseline.patch
          printf '%s  %s\n' \
            '3664cb57678877521ea4a696be5a9a63d92a7273530d9bf71ce7e0c1998746de' \
            '/tmp/pr52-baseline.patch' | sha256sum --check
          git apply --index /tmp/pr52-baseline.patch
          git rm .github/pr52-baseline.patch.gz.b64
          git rm -r .github/pr52-baseline-chunks
          git diff --cached --check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies and audit tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.16.1
          sudo apt-get update
          sudo apt-get install -y shellcheck postgresql-client

      - name: Static checks
        run: |
          ruff check bot config database services utils alembic tests \
            --select E4,E7,E9,F,B,ASYNC,PLE,PLW,RUF100 \
            --ignore PLW0603,PLW0108 --output-format full
          find . -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
          python -m compileall -q bot config database services utils alembic tests

      - name: Validate blank PostgreSQL baseline
        run: |
          alembic upgrade head
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          scripts = ScriptDirectory.from_config(Config('alembic.ini'))
          assert scripts.get_heads() == ['0001_clean_baseline'], scripts.get_heads()
          assert scripts.get_bases() == ['0001_clean_baseline'], scripts.get_bases()
          PY
          for table in users payments account_ledger_entries provider_refund_operations payment_disputes; do
            PGPASSWORD=projectx psql -h localhost -U projectx -d projectx_test -Atc \
              "SELECT to_regclass('public.${table}') IS NOT NULL" | grep -qx t
          done

      - name: Run full test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/pr52-baseline-tests.log
        env:
          RUN_BACKUP_INTEGRATION: "1"
          BACKUP_TEST_DATABASE_URL: postgresql://projectx:projectx@localhost:5432/projectx_test

      - name: Validate downgrade to empty schema and re-upgrade
        run: |
          alembic downgrade base
          remaining="$(PGPASSWORD=projectx psql -h localhost -U projectx -d projectx_test -Atc \
            "SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename <> 'alembic_version' ORDER BY tablename")"
          if [ -n "$remaining" ]; then
            printf 'Application tables remain after downgrade:\n%s\n' "$remaining" >&2
            exit 1
          fi
          alembic upgrade head
          head_revision="$(PGPASSWORD=projectx psql -h localhost -U projectx -d projectx_test -Atc \
            'SELECT version_num FROM alembic_version')"
          test "$head_revision" = '0001_clean_baseline'
          git diff --cached --check

      - name: Commit validated greenfield baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "db: replace migration history with clean balance baseline"
          git fetch origin feature/yookassa-account-balance
          git rebase origin/feature/yookassa-account-balance
          git push origin HEAD:feature/yookassa-account-balance
