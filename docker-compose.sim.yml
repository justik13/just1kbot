services:
  db:
    image: postgres:16.14-alpine
    container_name: just1kbot_sim_db
    restart: unless-stopped
    shm_size: "256m"
    environment:
      POSTGRES_USER: just1kbot
      POSTGRES_PASSWORD: sim_postgres_password_123
      POSTGRES_DB: just1kbot_bot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U just1kbot -d just1kbot_bot"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: just1kbot_sim_redis
    restart: unless-stopped
    command: redis-server --requirepass "sim_redis_password_123"
    environment:
      REDIS_PASSWORD: sim_redis_password_123
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"sim_redis_password_123\" redis-cli ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.sim
    container_name: just1kbot_sim_migrate
    restart: "no"
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://just1kbot:sim_postgres_password_123@db:5432/just1kbot_bot"
      DB_ENCRYPTION_KEY: "eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg="
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile.sim
    container_name: just1kbot_sim_app
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      BOT_TOKEN: "${BOT_TOKEN}"
      ADMIN_IDS: "${ADMIN_IDS:-[123456789]}"
      SUPPORT_USERNAME: "just1k_support"
      DATABASE_URL: "postgresql+asyncpg://just1kbot:sim_postgres_password_123@db:5432/just1kbot_bot"
      DB_ENCRYPTION_KEY: "eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg="
      REDIS_URL: "redis://:sim_redis_password_123@redis:6379/0"
      REDIS_PASSWORD: "sim_redis_password_123"
      YOOKASSA_SHOP_ID: "sim_mock_shop"
      YOOKASSA_SECRET_KEY: "sim_live_secret_key_123"
      YOOKASSA_RETURN_URL: "https://t.me/{bot_username}?start=pay_success"
      YOOKASSA_WEBHOOK_PORT: "8080"
      DOMAIN: "sim.just1k.net"
      SSL_EMAIL: "sim@just1k.net"
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
