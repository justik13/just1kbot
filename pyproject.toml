[project]
name = "just1kbot"
version = "1.0.0"
description = "Telegram bot for selling VPN access based on AmneziaWG 2.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",
    "F",
    "B",
    "ASYNC",
    "PLE", "PLW",
    "RUF100",
]
ignore = [
    "PLW0603",
    "PLW0108",
    "ASYNC109",
]
