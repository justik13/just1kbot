[project]
name = "just1kbot"
version = "1.0.0"
description = "Telegram bot for selling VPN access based on AmneziaWG 2.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "scripts/xray_api/generated",
]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",
    "F",
    "B",
    "ASYNC",
    "PLE", "PLW",
    "RUF100",
]
ignore = [
    "PLW0603",
    "PLW0108",
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"scripts/xray_api/generated/*" = ["F401", "F821", "E402", "E741", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", "scripts"]

