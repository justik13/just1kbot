services:
  db:
    ports:
      # CI-only compatibility for host-side smoke-test tooling. Production
      # compose intentionally does not publish PostgreSQL.
      - "5432:5432"
  redis:
    ports:
      # CI-only compatibility for host-side smoke-test tooling. Production
      # compose intentionally does not publish Redis.
      - "6379:6379"
  bot:
    environment:
      # Run the application startup path without making real Telegram API
      # calls or starting polling. DB, Redis, migrations and HTTP health are
      # still exercised by the Docker smoke test.
      CI_TEST_MODE: "true"
  caddy:
    ports:
      # Expose on 8081 for CI testing
      - "8081:80"
    volumes:
      - ./Caddyfile.ci:/etc/caddy/Caddyfile
