<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$title</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #090d16);
            --card-bg: var(--tg-theme-secondary-bg-color, rgba(15, 23, 42, 0.8));
            --text-main: var(--tg-theme-text-color, #f8fafc);
            --text-muted: var(--tg-theme-hint-color, #94a3b8);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --btn-primary: var(--tg-theme-button-color, #0284c7);
            --btn-primary-text: var(--tg-theme-button-text-color, #ffffff);
            --card-border: rgba(255, 255, 255, 0.08);
            --item-bg: rgba(255, 255, 255, 0.03);
            --item-hover: rgba(255, 255, 255, 0.06);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            line-height: 1.5;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 24px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .icon-badge {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(37, 99, 235, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 16px -4px var(--accent-glow);
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
            font-size: 12px;
            font-weight: 600;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #34d399;
            box-shadow: 0 0 8px #34d399;
        }
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(135deg, var(--btn-primary), #0284c7);
            color: var(--btn-primary-text);
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 20px -4px var(--accent-glow);
            transition: all 0.15s ease;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .url-box {
            background: var(--item-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .url-box:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }
        .url-info {
            overflow: hidden;
        }
        .url-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 2px;
            font-weight: 600;
        }
        .url-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-copy {
            background: var(--item-hover);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-copy.copied {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
            color: #34d399;
        }
        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
        }
        .store-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .store-btn {
            background: var(--item-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 6px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .store-btn:hover {
            background: var(--item-hover);
            border-color: rgba(56, 189, 248, 0.3);
        }
        .store-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .steps {
            background: var(--item-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .step-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 12px;
            color: var(--text-main);
        }
        .step-num {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .footer {
            font-size: 12px;
            color: var(--text-muted);
        }
        .footer a {
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .footer a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon-badge">🛡️</div>
            <h1>$title</h1>
            <p class="subtitle">$subtitle</p>
            <div class="status-pill">
                <span class="status-dot"></span>
                <span>$status_badge</span>
            </div>
        </div>

        <a href="$deep_link_safe" id="open-btn" class="btn-primary" onclick="handleOpenClick(event)">
            $btn_open_incy
        </a>

        <div class="url-box" onclick="copySubscriptionUrl()">
            <div class="url-info">
                <div class="url-label">$url_label</div>
                <div class="url-text">$sub_url_safe</div>
            </div>
            <button type="button" id="copy-btn" class="btn-copy">
                $btn_copy_sub
            </button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            <div class="section-title">$not_installed_title</div>
            <div class="store-grid">
                <a href="https://apps.apple.com/app/incy/id6756943388" target="_blank" rel="noopener" class="store-btn" onclick="openExternal(event, this.href)">
                    <svg viewBox="0 0 24 24">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.61 1.34-.55.63-1.03 1.68-.9 2.69 1 .08 2.03-.51 2.59-1.18z"/>
                    </svg>
                    <span>App Store</span>
                </a>
                <a href="https://play.google.com/store/apps/details?id=llc.itdev.incy" target="_blank" rel="noopener" class="store-btn" onclick="openExternal(event, this.href)">
                    <svg viewBox="0 0 24 24">
                        <path d="M3.6 2.4l11.1 11.1-3.2 3.2-9.7-12.7c.4-.7 1.1-1.3 1.8-1.6zm13.1 13.1l3.5-3.5c.8-.8.8-2 0-2.8l-3.5-3.5-3.2 3.2 3.2 3.2 3.2 3.4zm-14.9 6.1l9.7-12.7 3.2 3.2-11.1 11.1c-.7-.3-1.4-.9-1.8-1.6z"/>
                    </svg>
                    <span>Google Play</span>
                </a>
                <a href="https://github.com/INCY-DEV/incy-platforms/releases" target="_blank" rel="noopener" class="store-btn" onclick="openExternal(event, this.href)">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                    </svg>
                    <span>GitHub APK</span>
                </a>
            </div>
        </div>

        <div class="steps">
            <div class="step-row">
                <div class="step-num">1</div>
                <div>$step_1</div>
            </div>
            <div class="step-row">
                <div class="step-num">2</div>
                <div>$step_2</div>
            </div>
            <div class="step-row">
                <div class="step-num">3</div>
                <div>$step_3</div>
            </div>
        </div>

        <div class="footer">
            <a href="https://t.me/$bot_username_safe" target="_blank" rel="noopener" onclick="openExternal(event, this.href)">
                $footer_text
            </a>
        </div>
    </div>

    <script>
        var deepLink = $deep_link_js;
        var subUrl = $sub_url_js;

        // Initialize Telegram Mini App
        if (window.Telegram && window.Telegram.WebApp) {
            try {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            } catch (e) {}
        }

        // Open external links inside TMA via Telegram WebApp API
        function openExternal(e, url) {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
                e.preventDefault();
                window.Telegram.WebApp.openLink(url);
            }
        }

        function handleOpenClick(e) {
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    if (window.Telegram.WebApp.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
                    }
                } catch (err) {}

                if (window.Telegram.WebApp.openLink) {
                    e.preventDefault();
                    var separator = subUrl.indexOf('?') >= 0 ? '&' : '?';
                    window.Telegram.WebApp.openLink(subUrl + separator + 'open=app');
                    return;
                }
            }
            window.location.href = deepLink;
        }

        function copySubscriptionUrl() {
            var copyBtn = document.getElementById("copy-btn");
            var originalText = copyBtn.innerText;

            var notifySuccess = function() {
                copyBtn.innerText = "✅ Скопировано!";
                copyBtn.classList.add("copied");
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
                setTimeout(function() {
                    copyBtn.innerText = originalText;
                    copyBtn.classList.remove("copied");
                }, 2000);
            };

            var fallback = function() {
                var ta = document.createElement("textarea");
                ta.value = subUrl;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand("copy");
                    notifySuccess();
                } catch (e) {}
                document.body.removeChild(ta);
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(subUrl).then(notifySuccess).catch(fallback);
            } else {
                fallback();
            }
        }
    </script>
</body>
</html>
