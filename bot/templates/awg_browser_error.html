<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>$title</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #090d16);
            --card-bg: var(--tg-theme-secondary-bg-color, rgba(15, 23, 42, 0.8));
            --text-main: var(--tg-theme-text-color, #f8fafc);
            --text-muted: var(--tg-theme-hint-color, #94a3b8);
            --btn-primary: var(--tg-theme-button-color, #0284c7);
            --btn-primary-text: var(--tg-theme-button-text-color, #ffffff);
            --card-border: rgba(255, 255, 255, 0.08);
            --error-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            line-height: 1.5;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 32px 24px;
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .icon-badge {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 4px;
        }
        h1 {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-main);
        }
        p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }
        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            background: var(--btn-primary);
            color: var(--btn-primary-text);
            border: none;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.15s ease;
            margin-top: 8px;
        }
        .btn-back:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-badge">⚠️</div>
        <h1>$title</h1>
        <p>$message</p>

        <a href="https://t.me/$bot_username_safe" class="btn-back" onclick="handleBackClick(event, this.href)">
            $btn_back_to_bot
        </a>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            try {
                window.Telegram.WebApp.ready();
            } catch (e) {}
        }

        function handleBackClick(e, url) {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.close) {
                try {
                    window.Telegram.WebApp.close();
                    return;
                } catch (err) {}
            }
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                e.preventDefault();
                window.Telegram.WebApp.openTelegramLink(url);
            }
        }
    </script>
</body>
</html>
