<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>$title_safe</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --error: #ef4444;
            --btn-bg: #334155;
            --btn-hover: #475569;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .icon {
            font-size: 44px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--error);
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: var(--btn-bg);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.15s;
        }
        .btn:hover {
            background: var(--btn-hover);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#x26A0;&#xFE0F;</div>
        <h1>$title_safe</h1>
        <p>$message_safe</p>
        <a href="https://t.me/$bot_username_safe" class="btn">$btn_text</a>
    </div>
</body>
</html>
