    <div id="copyToast" class="copy-toast" aria-live="polite">Адрес подключения скопирован в буфер</div>

    <!-- Image Zoom Lightbox Modal -->
    <dialog id="imageLightbox" class="image-lightbox" aria-labelledby="lightboxCaption" aria-modal="true" onclick="onLightboxBackdropClick(event)">
        <div class="lightbox-container">
            <button type="button" class="lightbox-close-btn" onclick="closeImageLightbox()" aria-label="Закрыть (Esc)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
            <div class="lightbox-img-wrap">
                <img id="lightboxImg" src="" alt="" class="lightbox-img" onclick="toggleLightboxZoom(event)">
            </div>
            <div id="lightboxCaption" class="lightbox-caption"></div>
            <div class="lightbox-tip">Нажмите на фото для масштаба 100% • Esc или клик в фон, чтобы закрыть</div>
        </div>
    </dialog>
