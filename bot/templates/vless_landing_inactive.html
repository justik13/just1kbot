<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="color-scheme" content="dark">
    <title>Подключение к сервису</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0c0c0e;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-main: #fafafa;
            --text-sub: #a1a1aa;
            --cta-bg: #fafafa;
            --cta-hover: #e4e4e7;
            --cta-text: #09090b;
            --amber: #f59e0b;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(ellipse 90% 50% at 50% -10%, rgba(255, 255, 255, 0.06), transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }
        .card {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px 26px;
            text-align: center;
            box-shadow:
                0 24px 48px -12px rgba(0, 0, 0, 0.9),
                0 0 0 1px var(--border-subtle),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: cardEnter 280ms var(--ease-out) both;
        }
        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 999px;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.24);
            color: #fbbf24;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--amber);
            box-shadow: 0 0 8px var(--amber);
        }
        .icon-badge {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                0 0 0 1px var(--border-subtle),
                0 8px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }
        .icon-badge svg {
            width: 24px;
            height: 24px;
        }
        h1 {
            font-size: clamp(20px, 5vw, 23px);
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 52px;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: var(--cta-bg);
            color: var(--cta-text);
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 #ffffff;
            transition: transform 160ms var(--ease-out), background-color 150ms ease;
        }
        .btn:active {
            transform: scale(0.97);
        }
        @media (hover: hover) and (pointer: fine) {
            .btn:hover { background-color: var(--cta-hover); }
        }
        @media (max-width: 480px) {
            body {
                padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom)) 12px;
            }
            .card {
                padding: 26px 18px 22px;
                border-radius: 22px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-top">
            <div class="status-pill">
                <span class="status-dot"></span>
                <span>{status_badge}</span>
            </div>
            <div class="icon-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
            </div>
        </div>
        <h1>{status_title}</h1>
        <p>{status_description}</p>
        <a href="{bot_link}" class="btn">Перейти в бота @{clean_bot}</a>
    </div>
</body>
</html>
