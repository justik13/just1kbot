<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключение к сервису</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border-subtle);
            animation: cardEnter 280ms var(--ease-out) both;
        }
        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .icon { font-size: 48px; margin-bottom: 16px; line-height: 1; }
        h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
        p { font-size: 14px; color: var(--text-sub); margin-bottom: 24px; line-height: 1.5; }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background: var(--accent);
            color: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: transform 160ms var(--ease-out), background-color 150ms ease;
        }
        .btn:active {
            transform: scale(0.97);
        }
        @media (hover: hover) and (pointer: fine) {
            .btn:hover { background: var(--accent-hover); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⏳</div>
        <h1>Подписка не активна</h1>
        <p>Срок действия доступа истек или подписка приостановлена. Для возобновления перейдите в бота.</p>
        <a href="{bot_link}" class="btn">Перейти в бота @{clean_bot}</a>
    </div>
</body>
</html>
