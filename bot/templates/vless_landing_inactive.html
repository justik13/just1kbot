<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <meta name="color-scheme" content="dark">
    <title>Подключение к сервису</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0c0c0e;
            --surface-elevated: #141417;
            --surface-hover: #24242c;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.22);
            --text-main: #fafafa;
            --text-sub: #a1a1aa;
            --text-muted: #71717a;
            --cta-bg: #fafafa;
            --cta-hover: #e4e4e7;
            --cta-text: #09090b;
            --amber: #f59e0b;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(ellipse 90% 50% at 50% -10%, rgba(255, 255, 255, 0.06), transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }
        .card {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px 26px;
            text-align: center;
            box-shadow:
                0 24px 48px -12px rgba(0, 0, 0, 0.9),
                0 0 0 1px var(--border-subtle),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: cardEnter 280ms var(--ease-out) both;
        }
        @keyframes cardEnter {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .header-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 999px;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.24);
            color: #fbbf24;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--amber);
            box-shadow: 0 0 8px var(--amber);
        }
        .icon-badge {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                0 0 0 1px var(--border-subtle),
                0 8px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }
        .icon-badge svg {
            width: 24px;
            height: 24px;
        }
        h1 {
            font-size: clamp(20px, 5vw, 23px);
            font-weight: 600;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 52px;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            background-color: var(--cta-bg);
            color: var(--cta-text);
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 #ffffff;
            transition: transform 160ms var(--ease-out), background-color 150ms ease;
        }
        .btn:active {
            transform: scale(0.97);
        }
        @media (hover: hover) and (pointer: fine) {
            .btn:hover { background-color: var(--cta-hover); }
        }

        /* Collapsible Support Disclosure Accordion */
        .support-accordion {
            background-color: var(--surface-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            overflow: hidden;
            margin-top: 12px;
            transition:
                background-color 150ms ease,
                border-color 200ms ease,
                box-shadow 200ms ease;
        }

        .support-accordion:hover {
            border-color: var(--border-strong);
        }

        .support-accordion-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: color 150ms ease;
        }

        .support-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .support-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: var(--text-sub);
            transition: color 150ms ease;
        }

        .support-accordion:hover .support-icon,
        .support-accordion.open .support-icon {
            color: var(--text-main);
        }

        .support-chevron {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: var(--text-sub);
            transition: transform 240ms cubic-bezier(0.16, 1, 0.3, 1), color 150ms ease;
        }

        .support-accordion:hover .support-chevron {
            color: var(--text-main);
        }

        .support-accordion.open .support-chevron {
            transform: rotate(180deg);
            color: var(--text-main);
        }

        .support-form-container {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 260ms cubic-bezier(0.16, 1, 0.3, 1), visibility 260ms;
            overflow: hidden;
            visibility: hidden;
        }

        .support-accordion.open .support-form-container {
            grid-template-rows: 1fr;
            visibility: visible;
        }

        .support-form-inner {
            min-height: 0;
            overflow: hidden;
            padding: 0 16px;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 180ms ease, transform 200ms ease, padding 260ms ease;
            text-align: left;
            border-top: 1px solid transparent;
        }

        .support-accordion.open .support-form-inner {
            padding: 8px 16px 16px;
            opacity: 1;
            transform: translateY(0);
            border-top-color: rgba(255, 255, 255, 0.06);
        }

        .support-intro {
            font-size: 12.5px;
            color: var(--text-sub);
            line-height: 1.45;
            margin-bottom: 12px;
            padding-top: 4px;
        }

        .support-field {
            margin-bottom: 12px;
        }

        .support-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .support-input, .support-textarea {
            width: 100%;
            background-color: #09090b;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 11px 13px;
            font-size: 13.5px;
            color: var(--text-main);
            outline: none;
            font-family: inherit;
            transition: border-color 150ms ease, box-shadow 150ms ease;
            box-sizing: border-box;
        }

        .support-input::placeholder, .support-textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.9;
        }

        .support-input:focus, .support-textarea:focus {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 1px var(--border-strong);
        }

        .support-textarea {
            resize: vertical;
            min-height: 74px;
            line-height: 1.45;
        }

        .support-submit-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 46px;
            padding: 12px 16px;
            border-radius: 11px;
            background-color: var(--cta-bg);
            color: var(--cta-text);
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 150ms ease, background-color 150ms ease, transform 120ms var(--ease-out);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .support-submit-btn:hover {
            background-color: var(--cta-hover);
        }

        .support-submit-btn:active {
            transform: scale(0.975);
        }

        .support-submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .support-spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(0, 0, 0, 0.25);
            border-top-color: #09090b;
            border-radius: 50%;
            animation: supportSpin 600ms linear infinite;
        }

        @keyframes supportSpin {
            to { transform: rotate(360deg); }
        }

        .support-status-msg {
            display: none;
            padding: 11px 13px;
            border-radius: 10px;
            font-size: 12.5px;
            line-height: 1.4;
            margin-top: 10px;
            text-align: center;
        }

        .support-status-msg.success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #34d399;
        }

        .support-status-msg.error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        @media (max-width: 480px) {
            body {
                padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom)) 12px;
            }
            .card {
                padding: 26px 18px 22px;
                border-radius: 22px;
            }
            .btn {
                min-height: 52px;
                font-size: 14px;
            }
        }
        @media (max-width: 360px) {
            body {
                padding: max(8px, env(safe-area-inset-top)) 8px max(12px, env(safe-area-inset-bottom)) 8px;
            }
            .card {
                padding: 20px 14px 18px;
                border-radius: 18px;
            }
            .btn {
                min-height: 50px;
                font-size: 13.5px;
            }
            .support-accordion-header {
                padding: 13px 14px;
                font-size: 13.5px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-top">
            <div class="status-pill">
                <span class="status-dot"></span>
                <span>{status_badge}</span>
            </div>
            <div class="icon-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
            </div>
        </div>
        <h1>{status_title}</h1>
        <p>{status_description}</p>
        <a href="{bot_link}" class="btn">Перейти в бота @{clean_bot}</a>

        <!-- Support Disclosure Accordion -->
        <div id="supportAccordion" class="support-accordion">
            <button id="supportToggleBtn" type="button" class="support-accordion-header" onclick="toggleSupportForm()" aria-expanded="false" aria-controls="supportFormContainer">
                <span class="support-header-left">
                    <svg class="support-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>Связь с поддержкой</span>
                </span>
                <svg class="support-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>
            <div id="supportFormContainer" class="support-form-container" role="region" aria-label="Форма связи с поддержкой" aria-hidden="true">
                <div class="support-form-inner">
                    <p class="support-intro">Оставьте контакты для связи — мы напишем вам в удобное приложение и поможем с настройкой.</p>
                    <form id="emergencySupportForm" onsubmit="submitSupportReport(event)">
                        <div class="support-field">
                            <label for="supportContact" class="support-label">Куда вам написать?</label>
                            <input type="text" id="supportContact" class="support-input" placeholder="Telegram @username, WhatsApp, телефон или другой контакт" maxlength="100" required>
                        </div>
                        <div class="support-field">
                            <label for="supportMessage" class="support-label">Что произошло?</label>
                            <textarea id="supportMessage" class="support-textarea" placeholder="Опишите проблему или что не получается настроить" maxlength="1000" rows="3" required></textarea>
                        </div>
                        <button type="submit" id="supportSubmitBtn" class="support-submit-btn">
                            <span id="supportSubmitBtnText">Отправить контакты</span>
                        </button>
                        <div id="supportStatusMsg" class="support-status-msg" aria-live="polite"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSupportForm() {
            const accordion = document.getElementById("supportAccordion");
            const btn = document.getElementById("supportToggleBtn");
            const container = document.getElementById("supportFormContainer");
            if (!accordion || !btn) return;
            const isOpen = accordion.classList.contains("open");
            if (isOpen) {
                accordion.classList.remove("open");
                btn.setAttribute("aria-expanded", "false");
                if (container) container.setAttribute("aria-hidden", "true");
            } else {
                accordion.classList.add("open");
                btn.setAttribute("aria-expanded", "true");
                if (container) container.setAttribute("aria-hidden", "false");
                setTimeout(function() {
                    const input = document.getElementById("supportContact");
                    if (input) input.focus();
                }, 160);
            }
        }

        async function submitSupportReport(event) {
            event.preventDefault();
            const contactInput = document.getElementById("supportContact");
            const messageInput = document.getElementById("supportMessage");
            const submitBtn = document.getElementById("supportSubmitBtn");
            const statusMsg = document.getElementById("supportStatusMsg");
            if (!contactInput || !messageInput || !submitBtn || !statusMsg) return;

            const contact = contactInput.value.trim();
            const message = messageInput.value.trim();
            if (contact.length < 3) {
                const alertIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-right:6px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
                statusMsg.innerHTML = alertIcon + "Укажите контакт для связи (минимум 3 символа)";
                statusMsg.className = "support-status-msg error";
                statusMsg.style.display = "block";
                return;
            }
            if (message.length < 5) {
                const alertIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-right:6px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
                statusMsg.innerHTML = alertIcon + "Опишите проблему подробнее (минимум 5 символов)";
                statusMsg.className = "support-status-msg error";
                statusMsg.style.display = "block";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="support-spinner"></div><span>Отправка...</span>';
            statusMsg.style.display = "none";

            try {
                const reportUrl = window.location.pathname.replace(/\/$/, "") + "/report";
                const response = await fetch(reportUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contact: contact, message: message })
                });

                const data = await response.json().catch(() => ({}));
                if (response.ok && data.ok) {
                    const checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-right:6px;"><polyline points="20 6 9 17 4 12"/></svg>';
                    statusMsg.innerHTML = checkIcon + "Контакты отправлены. Мы скоро свяжемся с вами!";
                    statusMsg.className = "support-status-msg success";
                    statusMsg.style.display = "block";
                    contactInput.value = "";
                    messageInput.value = "";
                    submitBtn.style.display = "none";
                } else {
                    const errText = data.error || "Не удалось отправить. Попробуйте позже.";
                    const alertIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-right:6px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
                    statusMsg.innerHTML = alertIcon + errText;
                    statusMsg.className = "support-status-msg error";
                    statusMsg.style.display = "block";
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Отправить контакты</span>';
                }
            } catch (err) {
                const alertIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-right:6px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
                statusMsg.innerHTML = alertIcon + "Ошибка сети при отправке. Пожалуйста, проверьте соединение.";
                statusMsg.className = "support-status-msg error";
                statusMsg.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Отправить контакты</span>';
            }
        }
    </script>
</body>
</html>
