<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Just1k</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app/assets/css/tokens.css?v=2.7.1">
    <link rel="stylesheet" href="/app/assets/css/components.css?v=2.7.1">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark"><span class="brand-dot"></span></div>
                <span class="brand-title">Just1k</span>
                <span id="roleChip" class="chip chip-muted" hidden></span>
            </div>
            <div class="topbar-right">
                <div id="modeSwitch" class="mode-switch" hidden>
                    <button type="button" class="mode-btn" data-mode="cabinet">Кабинет</button>
                    <button type="button" class="mode-btn active" data-mode="admin">Админка</button>
                </div>
                <button type="button" id="profilePillBtn" class="profile-pill" hidden>
                    <span id="profileAvatar" class="avatar-circle">J</span>
                    <span id="profileBalanceText">0 ₽</span>
                </button>
                <div id="userChip" class="user-meta" hidden></div>
            </div>
        </header>

        <main id="appRoot" class="app-main">
            <section class="card card-center">
                <div class="muted">Проверка доступа...</div>
            </section>
        </main>
    </div>

    <div id="modalRoot" class="modal-backdrop" hidden></div>
    <div id="toastRoot" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/app/assets/js/app.js?v=2.7.1"></script>
</body>
</html>
