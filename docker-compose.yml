# docker-compose.yml
# This is the Greenfield production deployment configuration.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

services:
  db:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: just1kbot_db
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256m"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-just1kbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-just1kbot_bot}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-just1kbot} -d $${POSTGRES_DB:-just1kbot_bot} && PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U $${POSTGRES_USER:-just1kbot} -d $${POSTGRES_DB:-just1kbot_bot} -tAc 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: just1kbot_redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - backend_net
    command: >
      /bin/sh -c 'exec redis-server
      --requirepass "$$REDIS_PASSWORD"
      --maxmemory 384mb
      --maxmemory-policy noeviction'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: just1kbot_migrate
    restart: "no"
    logging: *default-logging
    networks:
      - backend_net
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DOCKER_DEPLOYMENT: "true"
      POSTGRES_HOST: "db"
      REDIS_HOST: "redis"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: just1kbot_app
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - frontend_net
      - backend_net
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DOCKER_DEPLOYMENT: "true"
      YOOKASSA_WEBHOOK_PORT: "8080"
      WEBHOOK_HOST: "0.0.0.0"
      POSTGRES_HOST: "db"
      REDIS_HOST: "redis"
      JUST1KBOT_HEARTBEAT_FILE: "/tmp/heartbeat"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: just1kbot_caddy:latest
    container_name: just1kbot_caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - frontend_net
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      SSL_EMAIL: ${SSL_EMAIL:?SSL_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      bot:
        condition: service_healthy

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: just1kbot_backup
    profiles: ["tools"]
    logging: *default-logging
    networks:
      - backend_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    volumes:
      - ./backups:/backups
    environment:
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT is required}
      BACKUP_REMOTE_URI: ${BACKUP_REMOTE_URI:-}
      BACKUP_REMOTE_TOKEN: ${BACKUP_REMOTE_TOKEN:-}
      POSTGRES_HOST: "db"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-just1kbot}
      POSTGRES_DB: ${POSTGRES_DB:-just1kbot_bot}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
